<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LocalSend 本地 API 连接诊断</title>
<style>
  body{font:15px/1.6 system-ui,-apple-system,"Microsoft YaHei",sans-serif;margin:0;padding:16px;background:#0f1115;color:#e6e6e6}
  h2{font-size:18px;margin:0 0 4px}
  .tip{color:#9aa0a6;font-size:13px;margin:0 0 14px;line-height:1.7}
  .card{background:#181b22;border:1px solid #2a2f3a;border-radius:12px;padding:14px;margin-bottom:12px}
  label{display:block;font-size:13px;color:#9aa0a6;margin:10px 0 5px}
  .row{display:flex;gap:8px;align-items:center}
  input,select{flex:1 1 0;min-width:0;padding:11px 10px;font-size:14px;border-radius:8px;
    border:1px solid #333a48;background:#0f1115;color:#e6e6e6;font-family:inherit}
  .fix{flex:0 0 auto}
  button{display:block;width:100%;margin:8px 0;padding:14px;font-size:15px;border:0;border-radius:10px;background:#2b6cff;color:#fff;cursor:pointer}
  button:active{opacity:.85}
  #btnInfo{background:#1faa59}
  #btnSend{background:#e8912d}
  pre{background:#000;color:#7CFC00;padding:12px;border-radius:10px;white-space:pre-wrap;word-break:break-all;
    max-height:58vh;overflow:auto;font-size:12.5px;margin:0;min-height:120px}
  .err{color:#ff6b6b}
  .ok{color:#51e898}
  .warn{color:#ffd166}
  .dim{color:#7c8085}
</style>
</head>
<body>
  <h2>📡 LocalSend 本地 API 连接诊断</h2>
  <p class="tip">
    目的：验证能否<b>绕过系统分享面板</b>，直接用 LocalSend 的 HTTP API 把文件发出去（解决大文件 NotAllowedError）。<br>
    前置：目标设备已<b>打开 LocalSend 并保持在前台</b>（默认端口 53317）。<br>
    · 目标在本<b>手机自己</b> → 填 <b>127.0.0.1</b><br>
    · 目标在<b>电脑</b> → 填电脑的局域网 IP（如 192.168.1.x）
  </p>

  <div class="card">
    <label>目标地址</label>
    <div class="row">
      <select id="proto" class="fix" style="flex:0 0 88px">
        <option value="http">http</option>
        <option value="https">https</option>
      </select>
      <input id="host" value="127.0.0.1" placeholder="IP">
      <input id="port" value="53317" placeholder="端口" class="fix" style="flex:0 0 78px">
    </div>
    <label>API 版本</label>
    <div class="row">
      <select id="ver">
        <option value="v1">v1（send-request + send，兼容最好）</option>
        <option value="v2">v2（prepare-upload + upload，LocalSend 2.x）</option>
      </select>
    </div>
    <label>PIN 码（对方设了才填，可留空）</label>
    <div class="row"><input id="pin" placeholder="留空则不发送 PIN"></div>
    <label>测试文件大小</label>
    <div class="row">
      <select id="size">
        <option value="small">小文本（~1 KB）</option>
        <option value="pdf">假 PDF（~1 MB）</option>
        <option value="big">较大（~20 MB）</option>
      </select>
    </div>
  </div>

  <button id="btnInfo">▶ 第一步：检测连通性（GET /info）</button>
  <button id="btnSend">📤 第二步：试发一个文件（完整链路）</button>
  <pre id="out">等待检测…</pre>

<script>
const $ = id => document.getElementById(id);
const out = $('out');
function log(s, cls){ const d=document.createElement('div'); if(cls) d.className=cls; d.textContent=s; out.appendChild(d); out.scrollTop=out.scrollHeight; }
function base(){ return ($('proto').value) + '://' + ($('host').value.trim()||'127.0.0.1') + ':' + ($('port').value.trim()||'53317'); }
function ver(){ return $('ver').value; }
function api(){ return '/api/localsend/' + ver() + '/'; }
function heads(h){ const a=[]; h.forEach((v,k)=>a.push('  '+k+': '+v)); return a.join('\n'); }
function fp(){ return 'z2p' + Math.random().toString(36).slice(2,10); }

const DEVINFO = {
  alias: 'zip2pdf-web', version: '2.0', deviceModel: 'Browser',
  deviceType: 'web', fingerprint: fp(), port: 53317,
  protocol: 'http', download: false
};

// ============ 第一步：连通性 ============
$('btnInfo').onclick = async () => {
  out.innerHTML='';
  const B = base(), A = api();
  log('▶ 目标: ' + B + A + 'info');
  log('本页地址: ' + location.href);
  if(location.protocol==='https:' && B.startsWith('http://') && $('host').value.trim()!=='127.0.0.1'){
    log('⚠️ https 页面 fetch 局域网 http → 会被「混合内容」拦截。建议改 http 打开本页，或让方 External Protocol 用 https。','warn');
  }
  log('');

  let r;
  try{
    log('【1】GET ' + A + 'info');
    r = await fetch(B + A + 'info?fingerprint=' + fp(), {cache:'no-store'});
  }catch(e){
    log('❌ 连通失败: ' + e.message, 'err');
    diagnose(e.message, B);
    return;
  }
  log('状态: ' + r.status + ' ' + r.statusText, r.ok?'ok':'err');
  log('响应头:\n' + heads(r.headers));
  const acao = r.headers.get('access-control-allow-origin');
  if(acao) log('✅ 有 CORS 头: ' + acao + '  → fetch 可用', 'ok');
  else log('⚠️ 无 ACAO 头：简单 GET 可能因「本机环回豁免」通过，但 **POST(JSON) 预检大概率被拦**', 'warn');

  let txt;
  try{ txt = await r.text(); }catch(e){ log('❌ 读取响应体失败: ' + e.message,'err'); return; }
  log('响应体: ' + txt.slice(0,400));
  let info;
  try{ info = JSON.parse(txt); }catch(e){ log('❌ 响应不是 JSON','err'); return; }
  log('');
  log('✅ LocalSend 在线！', 'ok');
  log('  设备名: ' + info.alias);
  log('  版本:   ' + info.version + '   类型: ' + info.deviceType + ' / ' + (info.deviceModel||'-'));
  log('  指纹:   ' + (info.fingerprint||'-'));
  if(info.protocol) log('  协议:   ' + info.protocol);
  if(info.port) log('  端口:   ' + info.port);

  // CORS 预检探测：POST + application/json 必触发 OPTIONS
  log('');
  log('【2】CORS 预检探测（决定是否真能发文件）');
  try{
    const pr = await fetch(B + A + (ver()==='v1' ? 'send-request' : 'prepare-upload'), {
      method:'OPTIONS',
      headers:{ 'Access-Control-Request-Method':'POST', 'Access-Control-Request-Headers':'content-type' }
    });
    log('预检状态: ' + pr.status, pr.ok?'ok':'err');
    log('预检响应头:\n' + heads(pr.headers));
    const acao2 = pr.headers.get('access-control-allow-origin');
    const acam  = pr.headers.get('access-control-allow-methods');
    const acah  = pr.headers.get('access-control-allow-headers');
    if(acao2 && /POST|\*/i.test(acam||'')) log('✅ 预检放行 → 可以直接 POST 发文件！', 'ok');
    else log('⚠️ 预检未明确放行（ACAO=' + acao2 + '，Methods=' + acam + '，Headers=' + acah + '）→ POST 可能被拦', 'warn');
  }catch(e){ log('⚠️ 预检请求失败: ' + e.message, 'warn'); }
};

// ============ 第二步：完整发送链路 ============
$('btnSend').onclick = async () => {
  out.innerHTML='';
  const B = base(), A = api(), V = ver();
  const which = $('size').value;
  const spec = which==='small' ? {name:'zip2pdf-test.txt', bytes:1024, type:'text/plain', ft:'text'}
             : which==='pdf'   ? {name:'zip2pdf-test.pdf', bytes:1024*1024, type:'application/pdf', ft:'pdf'}
             :                   {name:'zip2pdf-test-20mb.bin', bytes:20*1024*1024, type:'application/octet-stream', ft:'other'};

  log('▶ 发送目标: ' + B + '  （API ' + V + '）');
  log('构造测试文件: ' + spec.name + '  ' + (spec.bytes/1024).toFixed(0) + ' KB');
  const t0 = performance.now();
  const blob = new Blob([new Uint8Array(spec.bytes)], {type: spec.type});
  log('实际 blob 大小: ' + blob.size);
  log('');

  const fileId = 'f-' + Date.now();
  const pin = $('pin').value.trim();

  let tokens, sessionId = null;
  try{
    if(V === 'v1'){
      // --- v1: /send-request ---
      log('【1】POST ' + A + 'send-request');
      const body = {
        info: {alias:'zip2pdf-web', deviceModel:'Browser', deviceType:'web'},
        files: { [fileId]: {id:fileId, fileName:spec.name, size:blob.size, fileType:spec.ft, preview:null} }
      };
      const rr = await fetch(B + A + 'send-request', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
      });
      log('状态: ' + rr.status + ' ' + rr.statusText, rr.ok?'ok':'err');
      const rt = await rr.text();
      log('响应: ' + rt.slice(0,300));
      if(!rr.ok){ log('❌ send-request 失败：' + reason(rr.status), 'err'); return; }
      tokens = JSON.parse(rt);
    }else{
      // --- v2: /prepare-upload ---
      log('【1】POST ' + A + 'prepare-upload' + (pin?'?pin='+pin:''));
      const body = {
        info: DEVINFO,
        files: { [fileId]: {id:fileId, fileName:spec.name, size:blob.size, fileType:spec.type, sha256:null, preview:null} }
      };
      const rr = await fetch(B + A + 'prepare-upload' + (pin?'?pin='+encodeURIComponent(pin):''), {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
      });
      log('状态: ' + rr.status + ' ' + rr.statusText, rr.ok?'ok':'err');
      const rt = await rr.text();
      log('响应: ' + rt.slice(0,300));
      if(!rr.ok){ log('❌ prepare-upload 失败：' + reason(rr.status), 'err'); return; }
      const o = JSON.parse(rt);
      sessionId = o.sessionId;
      if(o.sessionId) log('sessionId: ' + o.sessionId);
      tokens = o.files;
    }
    log('拿到 token: ' + JSON.stringify(tokens), 'ok');
  }catch(e){
    log('❌ 第一步异常: ' + e.message, 'err'); diagnose(e.message, B); return;
  }

  const token = tokens && tokens[fileId];
  if(!token){ log('❌ 未拿到文件 token（对方可能拒绝了接收）', 'err'); return; }

  try{
    const q = V==='v1'
      ? (A + 'send?fileId=' + encodeURIComponent(fileId) + '&token=' + encodeURIComponent(token))
      : (A + 'upload?sessionId=' + encodeURIComponent(sessionId) + '&fileId=' + encodeURIComponent(fileId) + '&token=' + encodeURIComponent(token));
    log('');
    log('【2】POST ' + q.slice(0,120) + '…  body=' + spec.bytes + ' bytes');
    const t1 = performance.now();
    const ur = await fetch(B + q, { method:'POST', headers:{'Content-Type':'application/octet-stream'}, body: blob });
    const dt = performance.now() - t1;
    log('状态: ' + ur.status + ' ' + ur.statusText, ur.ok?'ok':'err');
    const ut = (await ur.text()).slice(0,200);
    if(ut) log('响应: ' + ut);
    if(ur.ok){
      const total = performance.now() - t0;
      log('');
      log('✅✅ 发送成功！请在目标 LocalSend 上确认是否弹出接收提示', 'ok');
      log('上传耗时 ' + (dt/1000).toFixed(2) + 's，整链路 ' + (total/1000).toFixed(2) + 's');
      log('速度约 ' + (spec.bytes/dt*1000/1024/1024).toFixed(1) + ' MB/s');
    }else{
      log('❌ 上传失败：' + reason(ur.status), 'err');
    }
  }catch(e){
    log('❌ 第二步异常: ' + e.message, 'err'); diagnose(e.message, B);
  }
};

function reason(status){
  return {400:'请求体格式不对',401:'需要 PIN（LocalSend 设了接收 PIN）',403:'对方拒绝了（文件类型过滤 / 拒绝接收）',
          409:'已有会话进行中（一次只允许一个 session）',412:'fingerprint 与对方相同（自我发现）',
          500:'服务器内部错误'}[status] || ('HTTP ' + status);
}
function diagnose(msg, B){
  log('');
  log('—— 可能原因 ——', 'warn');
  if(/Failed to fetch|NetworkError|ERR_/i.test(msg)){
    log('· LocalSend 没开 / 没在前台，或 IP、端口不对（默认 53317）', 'warn');
    if(B.startsWith('https://')) log('· https 目标是自签证书：Chrome 会因证书不受信任拒绝。可本浏览器新标签打开 ' + B + '/api/localsend/v1/info 手动点「继续访问」，信任后再回来测', 'warn');
    log('· 安卓「Wi-Fi 隔离/热点隔离」会禁止设备互访', 'warn');
  }
  if(/CORS/i.test(msg)) log('· CORS 被拦：LocalSend 未开放跨域，网页直连不可行', 'warn');
  if(/mixed|content/i.test(msg)) log('· 混合内容：https 页面不能请求 http 目标（127.0.0.1 除外），请改用 http 打开本页', 'warn');
  log('· 端口如果被 app 占用可在 LocalSend 设置里改，两边要一致', 'warn');
}
</script>
</body>
</html>
