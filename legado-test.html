<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Legado 漫画缓存 → PDF（测试页）</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f3f4f6; color: #1f2937; line-height: 1.6; padding: 16px; }
  .card { background: #fff; border-radius: 16px; padding: 18px; margin: 0 auto 16px; max-width: 720px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #6b7280; margin-bottom: 14px; }
  .btn { background: #4f46e5; color: #fff; border: 0; border-radius: 10px; padding: 11px 16px;
    font-size: 15px; cursor: pointer; }
  .btn.gray { background: #e5e7eb; color: #374151; }
  .btn:disabled { background: #d1d5db; cursor: not-allowed; }
  .btn.small { padding: 8px 12px; font-size: 14px; }
  #fileInput { display: none; }
  .bar-wrap { margin-top: 14px; display: none; }
  .bar { height: 10px; background: #e5e7eb; border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg,#818cf8,#4f46e5);
    transition: width .12s linear; }
  #progressText { margin-top: 6px; font-size: 13px; color: #4b5563; }
  #status { margin-top: 14px; font-size: 14px; min-height: 20px; color: #374151; }
  .sum { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px;
    font-size: 14px; margin-top: 12px; }
  .sum.warn { border-color: #fcd34d; background: #fffbeb; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid #f1f5f9; }
  th { color: #6b7280; font-weight: 600; }
  .ops { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .ops .btn { flex: 1; min-width: 140px; }
  .item { padding: 10px; border: 1px solid #e5e7eb; border-radius: 10px; margin-top: 10px;
    display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .item .meta { font-size: 13px; color: #6b7280; }
  .hint { font-size: 12px; color: #9ca3af; margin-top: 8px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Legado 漫画缓存 → PDF</h1>
    <div class="sub">测试页：把 legado 导出的漫画缓存 ZIP（含 images/ 与 .nb）按「话数 + 存储顺序」转成 PDF</div>
    <input type="file" id="fileInput" accept=".zip,application/zip,application/x-zip-compressed">
    <button class="btn" onclick="document.getElementById('fileInput').click()">选择 legado 缓存 ZIP</button>
    <div class="hint">不会影响你已有的 index.html，这是独立的测试页面</div>
    <div id="summary"></div>
    <div id="plan"></div>
    <div class="bar-wrap" id="barWrap">
      <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      <div id="progressText"></div>
    </div>
    <div id="status"></div>
    <div id="results"></div>
  </div>

  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script>
  // ===================== 常量 / 工具 =====================
  const IMAGE_RE = /\.(jpe?g|jpe|png|webp|bmp|gif|avif|ico|svg|tiff?|heic|heif)$/i;
  const JPEG_QUALITY = 0.92;
  const MAX_BYTES = 500 * 1024 * 1024;
  const RED_PNG = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAC0lEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';

  function fmtSize(bytes) {
    if (bytes >= 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    return Math.max(1, Math.round(bytes / 1024)) + ' KB';
  }
  function setProgress(p, label) {
    document.getElementById('barWrap').style.display = 'block';
    document.getElementById('barFill').style.width = Math.max(0, Math.min(100, p)).toFixed(1) + '%';
    document.getElementById('progressText').textContent = label || '';
  }
  function hideProgress() { document.getElementById('barWrap').style.display = 'none'; }
  function readViaFileReader(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onprogress = e => { if (e.lengthComputable) setProgress(e.loaded / e.total * 15, '读取文件…'); };
      r.onload = () => res(r.result);
      r.onerror = () => rej(new Error('文件读取失败'));
      r.readAsArrayBuffer(file);
    });
  }

  // ===================== 图片 → JPEG dataURL（白底重编码）=====================
  function toJpegDataURL(blob) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        try {
          const w = img.naturalWidth || 1024, h = img.naturalHeight || 1024;
          const c = document.createElement('canvas'); c.width = w; c.height = h;
          const g = c.getContext('2d');
          g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
          g.drawImage(img, 0, 0, w, h);
          const dataUrl = c.toDataURL('image/jpeg', JPEG_QUALITY);
          if (!dataUrl || dataUrl.length < 200) rej(new Error('图片过大，浏览器无法处理'));
          else res({ dataUrl, width: w, height: h });
        } catch (err) { rej(err); }
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('浏览器无法解码该图片格式')); };
      img.src = url;
    });
  }

  // ===================== 生成单个 PDF =====================
  async function buildPDF(images, onProgress) {
    const jsPDF = window.jspdf && window.jspdf.jsPDF;
    if (!jsPDF) throw new Error('jsPDF 未加载');
    let doc = null; const skipped = [];
    for (let i = 0; i < images.length; i++) {
      onProgress && onProgress(i);
      let out;
      try { out = await toJpegDataURL(await images[i].async('blob')); }
      catch (err) { skipped.push(images[i].name); continue; }
      const orient = out.width >= out.height ? 'landscape' : 'portrait';
      if (!doc) doc = new jsPDF({ orientation: orient, unit: 'px', format: [out.width, out.height] });
      else doc.addPage([out.width, out.height], orient);
      doc.addImage(out.dataUrl, 'JPEG', 0, 0, out.width, out.height);
    }
    if (!doc) throw new Error('没有可用的图片（格式可能全部不被支持）');
    return { blob: doc.output('blob'), skipped };
  }

  function skippedNote(skipped) {
    if (!skipped || !skipped.length) return '';
    const heic = skipped.filter(n => /\.hei[cf]$/i.test(n)).length;
    if (heic) return `｜跳过 ${skipped.length} 张（含 ${heic} 张 HEIC/HEIF，浏览器无法解码）`;
    return `｜跳过 ${skipped.length} 张无法解码的图片`;
  }

  // ===================== 解析 .nb → 话数 + 声明页数 =====================
  // nb 文件名形如 00040-<hash>.nb，内部是若干 <img src=".../<话号>-<hash>/<页>.jpg, {...}">
  // 按文件名字典序 = legado 下载顺序 = 话序
  async function parseChapters(zip) {
    const nbNames = Object.keys(zip.files)
      .filter(n => /\.nb$/i.test(n) && !zip.files[n].dir)
      .sort();
    const map = new Map(); // 话号 -> 声明页数（合并同话号）
    for (const name of nbNames) {
      let text = '';
      try { text = await zip.file(name).async('string'); } catch (e) { continue; }
      const count = (text.match(/<img[^>]*src="([^"]*)"/g) || []).length;
      let ch = null;
      const m = text.match(/\/(\d+)-[a-z0-9]+\/\d+\.(?:jpe?g|png|webp)/i);
      if (m) ch = parseInt(m[1], 10);
      if (ch == null) ch = map.size + 1;
      map.set(ch, (map.get(ch) || 0) + count);
    }
    return [...map.entries()].map(([num, count]) => ({ num, count }));
  }

  // ===================== 按比例把图片切片分话 =====================
  // 图片无法从文件名反推话数；唯一可靠顺序是 zip 存储顺序。
  // nb 声明页数(declaredTotal) 与实际图数(totalImages) 不符时，按声明比例缩放，
  // 保证所有图都被分完、且不超出可用数量。
  function splitImages(imageEntries, chapters, totalImages) {
    const declaredTotal = chapters.reduce((s, c) => s + c.count, 0);
    if (!declaredTotal) return [];
    let idx = 0;
    const groups = chapters.map(ch => {
      let n = (declaredTotal === totalImages)
        ? ch.count
        : Math.round(ch.count * totalImages / declaredTotal);
      n = Math.max(0, Math.min(n, totalImages - idx));
      const slice = imageEntries.slice(idx, idx + n);
      idx += n;
      return { num: ch.num, images: slice };
    });
    // 余数补齐到最后一组（保证所有图都被分配）
    if (idx < totalImages) {
      const rem = imageEntries.slice(idx);
      if (groups.length) groups[groups.length - 1].images =
        groups[groups.length - 1].images.concat(rem);
      else groups.push({ num: 1, images: rem });
    }
    return groups.filter(g => g.images.length);
  }

  // ===================== 取图片条目（zip 存储顺序）=====================
  function imageEntriesOf(zip, parent) {
    const list = Object.values(zip.files).filter(f => !f.dir && IMAGE_RE.test(f.name));
    if (parent) list.sort((a, b) => a.name.localeCompare(b.name)); // 同目录内按名排序兜底
    return list;
  }

  // ===================== 书名（去掉末尾 hash）=====================
  function baseTitle(zip) {
    const roots = new Set();
    for (const n of Object.keys(zip.files)) {
      const top = n.split('/')[0];
      if (top) roots.add(top);
    }
    let t = [...roots][0] || '漫画';
    return t.replace(/[0-9a-f]{8,}$/i, '').trim() || t;
  }

  // ===================== 主流程 =====================
  let CURRENT = null; // { zip, chapters, images, base, mismatch }

  async function handleFile(file) {
    const status = document.getElementById('status');
    const summary = document.getElementById('summary');
    const plan = document.getElementById('plan');
    summary.innerHTML = ''; plan.innerHTML = ''; document.getElementById('results').innerHTML = '';
    if (file.size > MAX_BYTES) {
      hideProgress();
      status.innerHTML = '<span style="color:#dc2626">⚠️ 文件 ' + fmtSize(file.size) +
        ' 超过 500 MB 上限</span>';
      return;
    }
    status.textContent = '正在读取…'; setProgress(0, '读取文件');
    try {
      const buf = await readViaFileReader(file);
      const zip = await JSZip.loadAsync(buf);
      const images = imageEntriesOf(zip);
      const nbNames = Object.keys(zip.files).filter(n => /\.nb$/i.test(n) && !zip.files[n].dir);
      setProgress(15, '解析缓存');
      if (!nbNames.length || !images.length) {
        status.innerHTML = '<span style="color:#dc2626">这不是 legado 缓存格式：' +
          '需要同时包含 images/ 图片与 .nb 清单。</span>';
        return;
      }
      const chapters = await parseChapters(zip);
      const totalImages = images.length;
      const declaredTotal = chapters.reduce((s, c) => s + c.count, 0);
      const mismatch = declaredTotal !== totalImages;
      const base = baseTitle(zip);

      CURRENT = { zip, chapters, images, base, mismatch, declaredTotal, totalImages };

      let html = '<div class="sum' + (mismatch ? ' warn' : '') + '">';
      html += '📚 书名：<b>' + base + '</b><br>';
      html += '检测到 <b>' + chapters.length + '</b> 话（第 ' + chapters[0].num + '–' +
        chapters[chapters.length - 1].num + ' 话）<br>';
      html += '实际图片 <b>' + totalImages + '</b> 张 · .nb 声明 <b>' + declaredTotal + '</b> 页';
      if (mismatch) {
        html += '<br><span style="color:#b45309">⚠️ 声明页数与实际图数不符（缓存可能未下载完），' +
          '将按存储顺序<b>按比例估算</b>分话，生成前请核对下方方案。</span>';
      }
      html += '</div>';
      summary.innerHTML = html;

      renderPlan(chapters, totalImages, declaredTotal, base);
      status.textContent = '解析完成，请选择生成方式';
    } catch (err) {
      status.innerHTML = '<span style="color:#dc2626">出错了：' + err.message + '</span>';
    }
  }

  function renderPlan(chapters, totalImages, declaredTotal, base) {
    const plan = document.getElementById('plan');
    const groups = splitImages(
      // 仅用于预览：用占位长度
      Array.from({ length: totalImages }), chapters, totalImages);
    let html = '<table><tr><th>话号</th><th>声明页数</th><th>预计分配</th></tr>';
    groups.forEach((g, i) => {
      html += '<tr><td>第 ' + g.num + ' 话</td><td>' + chapters[i].count +
        '</td><td>' + g.images.length + ' 页</td></tr>';
    });
    html += '</table>';
    html += '<div class="ops">' +
      '<button class="btn" id="btnSplit">按话拆分生成（' + groups.length + ' 本）</button>' +
      '<button class="btn gray" id="btnMerge">合并为 1 本</button></div>';
    html += '<div class="hint">合并：所有图按存储顺序合成 1 个 PDF；拆分：每话 1 个 PDF</div>';
    plan.innerHTML = html;
    document.getElementById('btnSplit').onclick = () => generate(false);
    document.getElementById('btnMerge').onclick = () => generate(true);
  }

  async function generate(merge) {
    if (!CURRENT) return;
    const { zip, chapters, images, base, mismatch } = CURRENT;
    const status = document.getElementById('status');
    const results = document.getElementById('results');
    results.innerHTML = '';
    const groups = merge
      ? [{ num: null, images }]
      : splitImages(images, chapters, images.length);
    let allSkipped = [];
    let done = 0; const total = groups.reduce((s, g) => s + g.images.length, 0);
    for (let gi = 0; gi < groups.length; gi++) {
      const g = groups[gi];
      const { blob, skipped } = await buildPDF(g.images, () => {
        done++;
        setProgress(15 + done / total * 85, '生成中 ' + done + '/' + total);
      });
      allSkipped = allSkipped.concat(skipped);
      const name = merge ? (base + '.pdf') : (base + '_第' + g.num + '话.pdf');
      renderResultItem(name, blob, g.images.length - skipped.length);
    }
    setProgress(100, '完成 ✔');
    status.textContent = (merge ? '已合并为 1 个 PDF' : ('已生成 ' + groups.length + ' 个 PDF')) +
      '（共 ' + (total - allSkipped.length) + ' 页）' + skippedNote(allSkipped);
  }

  function renderResultItem(name, blob, pages) {
    const results = document.getElementById('results');
    const url = URL.createObjectURL(blob);
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = '<div><div>' + name + '</div><div class="meta">' + fmtSize(blob.size) +
      ' · ' + pages + ' 页</div></div>';
    const a = document.createElement('a');
    a.className = 'btn small'; a.textContent = '下载'; a.href = url; a.download = name;
    div.appendChild(a);
    results.appendChild(div);
  }

  // ===================== 文件输入 =====================
  document.getElementById('fileInput').addEventListener('change', e => {
    const f = e.target.files[0]; e.target.value = '';
    if (f) handleFile(f);
  });

  // ===================== 暴露测试钩子 =====================
  window.LEGADO_TEST = {
    IMAGE_RE, parseChapters, splitImages, buildPDF, imageEntriesOf, baseTitle,
    handler: handleFile, RED_PNG,
    async makeSampleZip(opts) {
      // 构造一个合成 legado 缓存 ZIP 供测试；chapters: [{num,count}]
      const { chapters, baseName = '测试漫画abcd1234', redPng = RED_PNG } = opts || {};
      const z = new JSZip();
      const pngBytes = Uint8Array.from(atob(redPng), c => c.charCodeAt(0));
      let k = 0;
      for (const ch of chapters) {
        let nb = '';
        for (let p = 0; p < ch.count; p++) {
          const h = ('00000000' + (k).toString(16)).slice(-8);
          const imgName = baseName + '/images/' + h + '.png';
          z.file(imgName, pngBytes);
          nb += '<img src="https://x.com/scomic/' + baseName + '/0/' + ch.num + '-abc/' + (p + 1) +
            '.jpg, {"headers":{"Referer":"https://x.com/"}}">\n';
          k++;
        }
        const nbName = baseName + '/' + ('000' + ch.num).slice(-5) + '-deadbeef.nb';
        z.file(nbName, nb);
      }
      const blob = await z.generateAsync({ type: 'blob' });
      return new File([blob], baseName + '.zip', { type: 'application/zip' });
    }
  };
  </script>
</body>
</html>
