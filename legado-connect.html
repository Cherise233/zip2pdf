<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Legado 直连转 PDF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background:#0f1115; color:#e6e6e6; padding:14px; padding-bottom:120px; }
  h1 { font-size:18px; margin:4px 0 12px; }
  .card { background:#1a1d24; border:1px solid #2a2f3a; border-radius:12px; padding:14px; margin-bottom:12px; }
  label { display:block; font-size:13px; color:#9aa3b2; margin-bottom:6px; }
  input[type=text], select { width:100%; padding:10px; border-radius:8px; border:1px solid #2a2f3a;
         background:#0f1115; color:#e6e6e6; font-size:14px; }
  button { padding:10px 14px; border:none; border-radius:8px; background:#3b82f6; color:#fff;
           font-size:14px; font-weight:600; cursor:pointer; }
  button.ghost { background:#2a2f3a; color:#cfd6e2; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .row > * { flex:1 1 auto; }
  .book { padding:10px; border:1px solid #2a2f3a; border-radius:8px; background:#0f1115; margin-bottom:6px; }
  .book b { color:#fff; }
  .meta { font-size:12px; color:#7e879a; margin-top:2px; word-break:break-all; }
  .ch { display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:7px; background:#0f1115; margin-bottom:4px; }
  .ch input { width:18px; height:18px; }
  .ch span { font-size:13px; flex:1; }
  .bar { height:10px; background:#2a2f3a; border-radius:6px; overflow:hidden; margin-top:8px; }
  .bar > i { display:block; height:100%; width:0; background:#3b82f6; transition:width .2s; }
  .status { font-size:13px; color:#9aa3b2; margin-top:8px; line-height:1.5; white-space:pre-wrap; }
  .tag { display:inline-block; font-size:11px; padding:2px 7px; border-radius:20px; background:#1e3a5f; color:#7cc0ff; margin-left:6px; }
  .warn { font-size:12px; color:#ffb454; margin-top:6px; }
  #fab { position:fixed; left:14px; right:14px; bottom:14px; padding:14px; font-size:16px; border-radius:12px; }
</style>
</head>
<body>
<h1>📚 Legado 直连转 PDF</h1>

<div class="card">
  <label>Legado Web 服务地址</label>
  <div class="row">
    <input type="text" id="base" value="http://127.0.0.1:1122" placeholder="http://127.0.0.1:1122 或 手机局域网IP:1122">
    <button id="btnShelf" class="ghost">读取书架</button>
  </div>
  <div class="warn">⚠️ 需 Chrome/Edge（对 127.0.0.1 豁免 CORS）。Firefox 可能需同源。若页面是 https 打开，127.0.0.1 混合内容 Chrome 通常也豁免。</div>
</div>

<div class="card" id="bookCard" style="display:none">
  <label>选择书籍</label>
  <select id="bookSel"></select>
  <div class="row" style="margin-top:10px">
    <button id="btnChapters" class="ghost">读取章节</button>
  </div>
</div>

<div class="card" id="chCard" style="display:none">
  <label>选择要转换的章节（不勾=不下载，解决"不想下全本"）</label>
  <div class="row" style="margin-bottom:8px">
    <button id="btnAll" class="ghost" style="flex:1">全选</button>
    <button id="btnNone" class="ghost" style="flex:1">全不选</button>
    <input type="text" id="rangeFrom" placeholder="起" style="flex:1; min-width:54px">
    <input type="text" id="rangeTo" placeholder="止" style="flex:1; min-width:54px">
    <button id="btnRange" class="ghost" style="flex:1.4">选范围</button>
  </div>
  <div id="chList" style="max-height:42vh; overflow:auto"></div>
</div>

<div class="card" id="runCard" style="display:none">
  <div class="row">
    <button id="btnBuild">🚀 生成 PDF</button>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div class="status" id="status">就绪。</div>
</div>

<button id="fab" style="display:none">⬇️ 保存 PDF</button>

<script>
const $ = s => document.querySelector(s);
let BOOKS = [], CHAPTERS = [], SELECTED = new Set(), builtDoc = null;

async function api(path){
  const base = $('#base').value.trim().replace(/\/+$/,'');
  const res = await fetch(base + path, {mode:'cors', cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status+' @ '+path);
  return res;
}
function setStatus(t){ $('#status').textContent = t; }
function setProg(p){ $('#prog').style.width = Math.round(p*100)+'%'; }

async function loadShelf(){
  try{
    setStatus('正在读取书架…');
    const res = await api('/getBookshelf');
    const data = await res.json();
    BOOKS = Array.isArray(data) ? data : (data.data || []);
    if(!BOOKS.length){ setStatus('书架为空'); return; }
    const sel = $('#bookSel'); sel.innerHTML = '';
    BOOKS.forEach((b,i)=>{
      const o = document.createElement('option');
      o.value = i;
      o.textContent = (b.name || b.bookName || ('书籍'+i)) + '  ' + (b.author?('· '+b.author):'');
      sel.appendChild(o);
    });
    $('#bookCard').style.display='';
    setStatus('共 '+BOOKS.length+' 本，请选择。');
  }catch(e){ setStatus('读取书架失败：'+e.message+'\n（确认 legado Web 服务已开启、地址正确）'); }
}

async function loadChapters(){
  const b = BOOKS[+$('#bookSel').value];
  if(!b) return;
  const bookUrl = b.bookUrl || b.url;
  try{
    setStatus('读取章节中…');
    const res = await api('/getChapterList?url='+encodeURIComponent(bookUrl));
    const data = await res.json();
    CHAPTERS = Array.isArray(data) ? data : (data.chapters || data.data || []);
    const list = $('#chList'); list.innerHTML=''; SELECTED = new Set();
    CHAPTERS.forEach((c,i)=>{
      const name = c.name || c.title || ('第'+i+'章');
      const div = document.createElement('div'); div.className='ch';
      const cb = document.createElement('input'); cb.type='checkbox'; cb.dataset.i=i;
      cb.addEventListener('change', ()=>{ cb.checked?SELECTED.add(i):SELECTED.delete(i); });
      const sp = document.createElement('span'); sp.textContent = (i+1)+'. '+name;
      div.appendChild(cb); div.appendChild(sp); list.appendChild(div);
    });
    $('#chCard').style.display='';
    $('#runCard').style.display=''; $('#fab').style.display='';
    setStatus('共 '+CHAPTERS.length+' 话。勾选要转换的（可全选/范围）。');
  }catch(e){ setStatus('读取章节失败：'+e.message); }
}

// 从章节正文提取图片 URL（处理 JSON 包裹 + \u003c 转义 + 裸 HTML 三种情况）
// 注意：legado 的 src 形如 src="URL,{"headers":{...}}"，URL 内含逗号分隔的 JSON，
//       且 JSON 里有双引号 —— 必须先把整个 src 值（含内层引号）抓全，再按首个逗号切出纯图片 URL。
function extractImages(text){
  let html = text;
  try{ const o = JSON.parse(text); if(o && typeof o.data==='string') html = o.data; }catch(_){}
  html = html.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
             .replace(/&#39;/g,"'").replace(/&amp;/g,'&');
  const urls = [];
  // 抓全 src="..."（允许值内含双引号），要求闭合引号后紧跟 >（legado 无后续属性）
  const re = /\ssrc\s*=\s*"([\s\S]*?)"\s*>/gi; let m;
  while((m = re.exec(html))){
    const src = m[1];
    const comma = src.indexOf(',');
    urls.push(comma>=0 ? src.slice(0,comma) : src);
  }
  return urls;
}

// blob -> JPEG dataURL（canvas 不污染，因为 blob 同源）
function blobToJpeg(blob){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = ()=>{
      const c = document.createElement('canvas');
      c.width = img.naturalWidth || 800; c.height = img.naturalHeight || 1200;
      const ctx = c.getContext('2d');
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
      ctx.drawImage(img,0,0);
      URL.revokeObjectURL(url);
      resolve({ dataUrl:c.toDataURL('image/jpeg',0.92), w:c.width, h:c.height });
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('图片解码失败')); };
    img.src = url;
  });
}

// 并发限制拉取
async function mapLimit(items, limit, fn){
  const out = new Array(items.length);
  let idx = 0;
  async function worker(){
    while(idx < items.length){
      const i = idx++;
      out[i] = await fn(items[i], i);
    }
  }
  await Promise.all(Array.from({length:Math.min(limit,items.length)}, worker));
  return out;
}

// 自动探测 /image 参数顺序：url=图片地址&path=书籍源地址 是标准，部分版本反过来。
// 首张成功后记住正确顺序，后续不再试错。
let IMG_ORDER = null; // null=未知, false=url=picUrl/path=bookUrl, true=反向
async function fetchOne(bookUrl, picUrl, reverse){
  const [u1, p1] = reverse ? [bookUrl, picUrl] : [picUrl, bookUrl];
  const u = '/image?url='+encodeURIComponent(u1)+'&path='+encodeURIComponent(p1);
  let res;
  try{ res = await api(u); }
  catch(e){ throw new Error('请求失败: '+e.message); }
  if(!res.ok){
    const t = await res.text().catch(()=> '(无正文)');
    throw new Error('HTTP '+res.status+' ct='+(res.headers.get('content-type')||'?')+' body='+t.slice(0,100));
  }
  const ct = res.headers.get('content-type') || '';
  const blob = await res.blob();
  if(!/image|octet-stream|binary|application\/pdf/.test(ct)){
    const t = await blob.text().catch(()=> '');
    throw new Error('非图片 ct='+ct+' body='+t.slice(0,100));
  }
  return await blobToJpeg(blob);
}
async function fetchImage(bookUrl, picUrl){
  const orders = IMG_ORDER === null ? [false, true] : [IMG_ORDER];
  let lastErr;
  for(const rev of orders){
    try{
      const im = await fetchOne(bookUrl, picUrl, rev);
      if(IMG_ORDER === null) IMG_ORDER = rev;
      return im;
    }catch(e){ lastErr = e; }
  }
  throw lastErr;
}

async function build(){
  const b = BOOKS[+$('#bookSel').value];
  const bookUrl = b.bookUrl || b.url;
  const bookName = (b.name || b.bookName || 'legado') + '';
  const idxs = [...SELECTED].sort((x,y)=>x-y);
  if(!idxs.length){ setStatus('请先勾选至少一话。'); return; }
  $('#btnBuild').disabled = true;
  try{
    // 阶段一：收集各章图片 URL（先统计总数，进度才准）
    setStatus('收集章节图片列表…');
    const chaptersData = [];
    let total = 0;
    for(const ci of idxs){
      const ch = CHAPTERS[ci];
      setStatus('读取第 '+(ci+1)+' 话：'+(ch.name||ch.title||'')+' …');
      let content;
      try{
        const r = await api('/getBookContent?url='+encodeURIComponent(bookUrl)+'&index='+ci);
        content = await r.text();
      }catch(e){ setStatus('第'+(ci+1)+'话正文失败：'+e.message+'（跳过）'); continue; }
      const urls = extractImages(content);
      if(!urls.length){ setStatus('第'+(ci+1)+'话无图片（可能是文字章，跳过）'); continue; }
      chaptersData.push({ci, urls});
      total += urls.length;
    }
    if(!total){ setStatus('没有可生成的图片。'); $('#btnBuild').disabled=false; return; }

    // 阶段二：逐张取图，实时更新进度
    setStatus('开始取图，共 '+total+' 张…');
    const pages = [];
    let done = 0, failed = 0;
    for(const {ci, urls} of chaptersData){
      const imgs = await mapLimit(urls, 4, async (picUrl)=>{
        try{
          const im = await fetchImage(bookUrl, picUrl);
          done++; setProg(done/total);
          return im;
        }catch(e){
          failed++; done++; setProg(done/total);
          setStatus('第'+(ci+1)+'话 1 张取图失败：'+e.message);
          return null;
        }
      });
      for(const im of imgs){ if(im) pages.push(im); }
    }

    if(!pages.length){
      setStatus('全部图片取图失败（见上方"取图失败"报错）。\n常见：/image 参数顺序仍不对，或该图源 legado 也取不到。\n把具体报错发我即可定位。');
      $('#btnBuild').disabled=false; return;
    }

    setStatus('合成 PDF（'+pages.length+' 张）…');
    const jspdf = window.jspdf.jsPDF;
    const doc = new jspdf({orientation:'portrait', unit:'pt', format:'a4'});
    const pw = doc.internal.pageSize.getWidth();
    const ph = doc.internal.pageSize.getHeight();
    pages.forEach((p,i)=>{
      if(i>0) doc.addPage();
      const scale = Math.min(pw/p.w, ph/p.h);
      const w = p.w*scale, h = p.h*scale;
      doc.addImage(p.dataUrl, 'JPEG', (pw-w)/2, (ph-h)/2, w, h);
    });
    builtDoc = doc;
    const name = bookName.replace(/[\\/:*?"<>|]/g,'_');
    builtDoc._fname = name + '_' + idxs.length + '话.pdf';
    setStatus('✅ 完成！共 '+pages.length+' 张，失败 '+failed+' 张。\n点击底部按钮保存：'+builtDoc._fname);
    $('#fab').textContent = '⬇️ 保存 '+builtDoc._fname;
  }catch(e){ setStatus('生成出错：'+e.message); }
  finally{ $('#btnBuild').disabled = false; }
}

function save(){
  if(builtDoc) builtDoc.save(builtDoc._fname || 'legado.pdf');
}

// 事件
$('#btnShelf').addEventListener('click', loadShelf);
$('#btnChapters').addEventListener('click', loadChapters);
$('#btnAll').addEventListener('click', ()=>{
  document.querySelectorAll('#chList input').forEach(cb=>{cb.checked=true; SELECTED.add(+cb.dataset.i);});
});
$('#btnNone').addEventListener('click', ()=>{
  document.querySelectorAll('#chList input').forEach(cb=>{cb.checked=false;});
  SELECTED.clear();
});
$('#btnRange').addEventListener('click', ()=>{
  const a=parseInt($('#rangeFrom').value,10), b=parseInt($('#rangeTo').value,10);
  if(isNaN(a)||isNaN(b)){ setStatus('范围请输入数字'); return; }
  const lo=Math.min(a,b)-1, hi=Math.max(a,b)-1;
  document.querySelectorAll('#chList input').forEach(cb=>{
    const i=+cb.dataset.i;
    if(i>=lo && i<=hi){ cb.checked=true; SELECTED.add(i); } else { cb.checked=false; SELECTED.delete(i); }
  });
  setStatus('已选第 '+Math.min(a,b)+'~'+Math.max(a,b)+' 话。');
});
$('#btnBuild').addEventListener('click', build);
$('#fab').addEventListener('click', save);
</script>
</body>
</html>
