<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Legado 直连转 PDF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         background:#f3f4f6; color:#1f2937; line-height:1.6; padding:16px; padding-bottom:120px; }
  .card { background:#fff; border-radius:16px; padding:18px; margin:0 auto 16px; max-width:720px;
          box-shadow:0 1px 3px rgba(0,0,0,.08); }
  h1 { font-size:19px; margin:0 0 4px; }
  .sub { font-size:13px; color:#6b7280; margin-bottom:14px; }
  label { display:block; font-size:13px; color:#6b7280; margin-bottom:6px; }
  input[type=text], select { width:100%; padding:10px; border-radius:10px; border:1px solid #e5e7eb;
         background:#fff; color:#1f2937; font-size:14px; }
  button { padding:11px 16px; border:none; border-radius:10px; background:#4f46e5; color:#fff;
           font-size:15px; cursor:pointer; }
  button.ghost { background:#e5e7eb; color:#374151; }
  button:disabled { background:#d1d5db; color:#9ca3af; cursor:not-allowed; }
  button.small { padding:8px 12px; font-size:14px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .row > * { flex:1 1 auto; }
  .book { padding:10px; border:1px solid #e5e7eb; border-radius:10px; background:#f9fafb; margin-bottom:6px; }
  .book b { color:#1f2937; }
  .meta { font-size:12px; color:#9ca3af; margin-top:2px; word-break:break-all; }
  .ch { display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:8px; background:#f9fafb;
        border:1px solid #e5e7eb; margin-bottom:4px; }
  .ch input { width:18px; height:18px; }
  .ch span { font-size:13px; flex:1; }
  .bar { height:10px; background:#e5e7eb; border-radius:999px; overflow:hidden; margin-top:8px; }
  .bar > i { display:block; height:100%; width:0; background:linear-gradient(90deg,#818cf8,#4f46e5); transition:width .2s; }
  .status { font-size:14px; color:#374151; margin-top:8px; line-height:1.5; white-space:pre-wrap; }
  .tag { display:inline-block; font-size:11px; padding:2px 7px; border-radius:20px; background:#e0e7ff; color:#4f46e5; margin-left:6px; }
  .warn { font-size:12px; color:#b45309; margin-top:6px; }
  #fab { position:fixed; left:14px; right:14px; bottom:14px; padding:14px; font-size:16px; border-radius:12px; }
</style>
</head>
<body>
<div class="card">
  <h1>📚 Legado 直连转 PDF</h1>
  <div class="sub">手机直连 legado Web 服务（默认 127.0.0.1:1122），按需选章、自动防缺图，转成 PDF</div>
</div>

<div class="card">
  <label>Legado Web 服务地址</label>
  <div class="row">
    <input type="text" id="base" value="http://127.0.0.1:1122" placeholder="http://127.0.0.1:1122 或 手机局域网IP:1122">
    <button id="btnShelf" class="ghost">读取书架</button>
  </div>
  <div class="warn">⚠️ 需 Chrome/Edge（对 127.0.0.1 豁免 CORS）。Firefox 可能需同源。若页面是 https 打开，127.0.0.1 混合内容 Chrome 通常也豁免。</div>
</div>

<div class="card" id="bookCard" style="display:none">
  <label>选择书籍</label>
  <select id="bookSel"></select>
  <div class="row" style="margin-top:10px">
    <button id="btnChapters" class="ghost">读取章节</button>
  </div>
</div>

<div class="card" id="chCard" style="display:none">
  <label>选择要转换的章节（不勾=不下载，解决"不想下全本"）</label>
  <div class="row" style="margin-bottom:8px">
    <button id="btnAll" class="ghost" style="flex:1">全选</button>
    <button id="btnNone" class="ghost" style="flex:1">全不选</button>
    <input type="text" id="rangeFrom" placeholder="起" style="flex:1; min-width:54px">
    <input type="text" id="rangeTo" placeholder="止" style="flex:1; min-width:54px">
    <button id="btnRange" class="ghost" style="flex:1.4">选范围</button>
  </div>
  <div id="chList" style="max-height:42vh; overflow:auto"></div>
</div>

<div class="card" id="runCard" style="display:none">
  <div class="row">
    <button id="btnBuild">🚀 生成 PDF</button>
  </div>
  <button id="btnReDL" class="ghost" style="display:none; width:100%; margin-top:8px">🔄 重新下载坏图</button>
  <div class="bar"><i id="prog"></i></div>
  <div class="status" id="status">就绪。</div>
</div>

<button id="fab" style="display:none">⬇️ 保存 PDF</button>

<script>
const $ = s => document.querySelector(s);
let BOOKS = [], CHAPTERS = [], SELECTED = new Set(), builtDoc = null, IMAGES = [];
const CONCURRENCY = 8;       // 并发取图路数（本地 legado，拉到 8 提速）
const RETRIES    = 2;        // 网络错误重试次数（占位图不重试，避免浪费）
const PLACEHOLDER_BYTES = 50000; // 占位图/半截图字节阈值（漫画页 1440px 通常 >100KB）
const VAR_THRESHOLD = 4;     // 像素方差阈值：近乎纯色=占位图

async function api(path){
  const base = $('#base').value.trim().replace(/\/+$/,'');
  const res = await fetch(base + path, {mode:'cors', cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status+' @ '+path);
  return res;
}
function setStatus(t){ $('#status').textContent = t; }
function setProg(p){ $('#prog').style.width = Math.round(p*100)+'%'; }

async function loadShelf(){
  try{
    setStatus('正在读取书架…');
    const res = await api('/getBookshelf');
    const data = await res.json();
    BOOKS = Array.isArray(data) ? data : (data.data || []);
    if(!BOOKS.length){ setStatus('书架为空'); return; }
    const sel = $('#bookSel'); sel.innerHTML = '';
    BOOKS.forEach((b,i)=>{
      const o = document.createElement('option');
      o.value = i;
      o.textContent = (b.name || b.bookName || ('书籍'+i)) + '  ' + (b.author?('· '+b.author):'');
      sel.appendChild(o);
    });
    $('#bookCard').style.display='';
    setStatus('共 '+BOOKS.length+' 本，请选择。');
  }catch(e){ setStatus('读取书架失败：'+e.message+'\n（确认 legado Web 服务已开启、地址正确）'); }
}

async function loadChapters(){
  const b = BOOKS[+$('#bookSel').value];
  if(!b) return;
  const bookUrl = b.bookUrl || b.url;
  try{
    setStatus('读取章节中…');
    const res = await api('/getChapterList?url='+encodeURIComponent(bookUrl));
    const data = await res.json();
    CHAPTERS = Array.isArray(data) ? data : (data.chapters || data.data || []);
    const list = $('#chList'); list.innerHTML=''; SELECTED = new Set();
    CHAPTERS.forEach((c,i)=>{
      const name = c.name || c.title || ('第'+i+'章');
      const div = document.createElement('div'); div.className='ch';
      const cb = document.createElement('input'); cb.type='checkbox'; cb.dataset.i=i;
      cb.addEventListener('change', ()=>{ cb.checked?SELECTED.add(i):SELECTED.delete(i); });
      const sp = document.createElement('span'); sp.textContent = (i+1)+'. '+name;
      div.appendChild(cb); div.appendChild(sp); list.appendChild(div);
    });
    $('#chCard').style.display='';
    $('#runCard').style.display=''; $('#fab').style.display='';
    setStatus('共 '+CHAPTERS.length+' 话。勾选要转换的（可全选/范围）。');
  }catch(e){ setStatus('读取章节失败：'+e.message); }
}

// 从章节正文提取图片（处理 JSON 包裹 + \u003c 转义 + 裸 HTML 三种情况）
// 关键：返回【完整 src】（URL + ,{"headers":{...}} JSON 后缀）。
// legado 的 /image 接口把 path 参数原样交给 ImageProvider，内部经 AnalyzeUrl 解析，
// 恰恰要靠这段 JSON 后缀拿到 Referer/Cookie —— 切掉它 legado 就裸请求图床，防盗链 403 → 返回错误占位图。
// 同时保留干净 url 仅用于显示。
function extractImages(text){
  let html = text;
  try{ const o = JSON.parse(text); if(o && typeof o.data==='string') html = o.data; }catch(_){}
  html = html.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
             .replace(/&#39;/g,"'").replace(/&amp;/g,'&');
  const imgs = [];
  // 抓全 src="..."（允许值内含双引号），要求闭合引号后紧跟 >（legado 无后续属性）
  const re = /\ssrc\s*=\s*"([\s\S]*?)"\s*>/gi; let m;
  while((m = re.exec(html))){
    const full = m[1];
    const comma = full.indexOf(',');
    imgs.push({ url: comma>=0 ? full.slice(0,comma) : full, src: full });
  }
  return imgs;
}

// blob -> JPEG dataURL + 尺寸 + 亮度方差（方差用于识别“近乎纯色的占位图”）
function blobToJpeg(blob){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = ()=>{
      const w = img.naturalWidth || 800, h = img.naturalHeight || 1200;
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0);
      URL.revokeObjectURL(url);
      let variance = 999; // 读不到就按正常图处理
      try{
        const step = Math.max(1, Math.floor((w*h)/2000));
        const data = ctx.getImageData(0,0,w,h).data;
        let sum=0, n=0;
        for(let i=0;i<data.length;i+=4*step){ sum+=(data[i]+data[i+1]+data[i+2])/3; n++; }
        const mean=sum/n; let s=0;
        for(let i=0;i<data.length;i+=4*step){ const v=(data[i]+data[i+1]+data[i+2])/3-mean; s+=v*v; }
        variance=Math.sqrt(s/n);
      }catch(_){}
      resolve({ dataUrl:c.toDataURL('image/jpeg',0.92), w, h, variance, size: blob.size });
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('图片解码失败')); };
    img.src = url;
  });
}

// 并发限制拉取
async function mapLimit(items, limit, fn){
  const out = new Array(items.length);
  let idx = 0;
  async function worker(){
    while(idx < items.length){
      const i = idx++;
      out[i] = await fn(items[i], i);
    }
  }
  await Promise.all(Array.from({length:Math.min(limit,items.length)}, worker));
  return out;
}

// /image 接口（已核对 legado 源码 BookController.getImg）：
//   url=bookUrl（查书+书源）  path=完整 src（含 ,{headers} JSON，legado 解析 Referer）  width=解码宽度
// 下载失败 legado 不报错，返回 errorBitmap 占位图（HTTP 200）。
async function downloadToJpeg(bookUrl, fullSrc){
  const u = '/image?url='+encodeURIComponent(bookUrl)
          +'&path='+encodeURIComponent(fullSrc)
          +'&width=1440';
  let res;
  try{ res = await api(u); }
  catch(e){ throw new Error('请求失败: '+e.message); }
  if(!res.ok){
    const t = await res.text().catch(()=> '(无正文)');
    throw new Error('HTTP '+res.status+' ct='+(res.headers.get('content-type')||'?')+' body='+t.slice(0,100));
  }
  const ct = res.headers.get('content-type') || '';
  const blob = await res.blob();
  if(!/image|octet-stream|binary/.test(ct)){
    const t = await blob.text().catch(()=> '');
    throw new Error('非图片 ct='+ct+' body='+t.slice(0,100));
  }
  return await blobToJpeg(blob);
}

// 取一张图：网络错误重试；占位图（防盗链/半截）直接标记不再重试
async function fetchItem(bookUrl, it){
  let lastErr='';
  for(let a=0; a<RETRIES; a++){
    try{
      const jpg = await downloadToJpeg(bookUrl, it.src);
      const broken = jpg.size < PLACEHOLDER_BYTES || jpg.variance < VAR_THRESHOLD;
      it.data = broken ? null : jpg;
      it.broken = broken;
      it.err  = broken ? '坏图/占位图' : '';
      return;
    }catch(e){
      lastErr = e.message;
      if(a < RETRIES-1) continue; // 网络错误重试，占位图不重试
    }
  }
  it.data=null; it.broken=true; it.err=lastErr;
}

// 全局并发池取图（跨章节统一调度，吞吐更高）
async function runFetch(items, bookUrl, onOne){
  await mapLimit(items, CONCURRENCY, async (it)=>{
    await fetchItem(bookUrl, it);
    onOne(it);
  });
}

// 文件名非法字符清洗
function safeName(s){
  return (s||'').replace(/[\\/:*?"<>|]/g,'_').trim() || '未命名';
}
// 文件名规则：单章→漫画名_章节名；多选→漫画名_范围（连续 1-5，否则 1,3,5）
function makeFname(bookName, idxs){
  const name = safeName(bookName);
  const sorted = [...idxs].sort((a,b)=>a-b);
  if(sorted.length === 1){
    const ch = CHAPTERS[sorted[0]];
    const chName = safeName(ch ? (ch.name||ch.title) : ('第'+(sorted[0]+1)+'话'));
    return name + '_' + chName + '.pdf';
  }
  const disp = sorted.map(i=>i+1);
  let range;
  if(disp[disp.length-1] - disp[0] === disp.length-1) range = disp[0] + '-' + disp[disp.length-1];
  else range = disp.join(',');
  return name + '_' + range + '话.pdf';
}

// 按顺序合成 PDF（跳过坏图，保持页码对应）
function renderPdf(bookName, idxs){
  const jspdf = window.jspdf.jsPDF;
  const doc = new jspdf({orientation:'portrait', unit:'pt', format:'a4'});
  const pw = doc.internal.pageSize.getWidth();
  const ph = doc.internal.pageSize.getHeight();
  let n=0;
  for(const it of IMAGES){
    if(!it.data) continue;
    if(n>0) doc.addPage();
    const p=it.data, scale = Math.min(pw/p.w, ph/p.h);
    const w=p.w*scale, h=p.h*scale;
    doc.addImage(p.dataUrl, 'JPEG', (pw-w)/2, (ph-h)/2, w, h);
    n++;
  }
  builtDoc = doc;
  builtDoc._fname = makeFname(bookName, idxs);
  return n;
}

async function build(){
  const b = BOOKS[+$('#bookSel').value];
  const bookUrl = b.bookUrl || b.url;
  const bookName = (b.name || b.bookName || 'legado') + '';
  const idxs = [...SELECTED].sort((x,y)=>x-y);
  if(!idxs.length){ setStatus('请先勾选至少一话。'); return; }
  $('#btnBuild').disabled = true; $('#btnReDL').style.display='none';
  IMAGES = [];
  try{
    // 阶段一：收集各章图片到扁平列表（保留位置/章节，便于坏图重下）
    setStatus('收集章节图片列表…');
    let total=0;
    for(const ci of idxs){
      const ch = CHAPTERS[ci];
      setStatus('读取第 '+(ci+1)+' 话：'+(ch.name||ch.title||'')+' …');
      let content;
      try{
        const r = await api('/getBookContent?url='+encodeURIComponent(bookUrl)+'&index='+ci);
        content = await r.text();
      }catch(e){ setStatus('第'+(ci+1)+'话正文失败：'+e.message+'（跳过）'); continue; }
      const urls = extractImages(content);
      if(!urls.length){ setStatus('第'+(ci+1)+'话无图片（可能是文字章，跳过）'); continue; }
      for(const u of urls){
        IMAGES.push({ ci, chName:(ch.name||ch.title||('第'+ci)), url:u.url, src:u.src,
                      data:null, broken:false, err:'' });
      }
      total += urls.length;
    }
    if(!total){ setStatus('没有可生成的图片。'); $('#btnBuild').disabled=false; return; }

    // 阶段二：全局并发取图，实时统计坏图
    setStatus('开始取图，共 '+total+' 张（并发 '+CONCURRENCY+'）…');
    let done=0, broken=0;
    await runFetch(IMAGES, bookUrl, (it)=>{
      done++; if(it.broken) broken++;
      setProg(done/total);
      if(it.broken) setStatus('取图中 '+done+'/'+total+' … 已发现坏图 '+broken+' 张');
    });

    const n = renderPdf(bookName, idxs);
    if(!n){
      const lastErr = (IMAGES.find(i=>i.err && i.err!=='坏图/占位图')||{}).err || '占位图';
      setStatus('全部图片取图失败/坏图。\n最后错误：'+lastErr+'\n把这段报错发我即可定位。');
      $('#btnBuild').disabled=false; return;
    }
    setStatus('✅ 完成！成功 '+n+' 张'
      + (broken ? '，坏图 '+broken+' 张（点下面按钮可只重下坏图）' : '')
      + '。\n点击底部保存：'+builtDoc._fname);
    $('#fab').textContent = '⬇️ 保存 '+builtDoc._fname;
    if(broken){
      $('#btnReDL').style.display='';
      $('#btnReDL').textContent='🔄 重新下载坏图 ('+broken+')';
    }
  }catch(e){ setStatus('生成出错：'+e.message); }
  finally{ $('#btnBuild').disabled = false; }
}

// 只重下坏图：再请求一次（legado 有缓存，常在第二次成功），然后重排 PDF
async function reDownloadBroken(){
  const bad = IMAGES.filter(it=>it.broken);
  if(!bad.length){ setStatus('当前没有坏图。'); return; }
  $('#btnReDL').disabled = true; $('#btnBuild').disabled = true;
  const b = BOOKS[+$('#bookSel').value];
  const bookUrl = b.bookUrl || b.url;
  const bookName = (b.name || b.bookName || 'legado') + '';
  try{
    setStatus('重新下载坏图，共 '+bad.length+' 张…');
    let done=0, still=0;
    await runFetch(bad, bookUrl, (it)=>{
      done++; if(it.broken) still++;
      setProg(done/bad.length);
    });
    const n = renderPdf(bookName, [...SELECTED]);
    if(still){
      setStatus('重下完成，仍有 '+still+' 张坏图（图源/网络不稳，可再点一次重下）。\n成功 '+n+' 张。');
      $('#btnReDL').textContent='🔄 再试下载坏图 ('+still+')';
    }else{
      setStatus('🎉 全部坏图已补回！成功 '+n+' 张。点击下方保存。');
      $('#btnReDL').style.display='none';
    }
  }catch(e){ setStatus('重下出错：'+e.message); }
  finally{ $('#btnReDL').disabled=false; $('#btnBuild').disabled=false; }
}

function save(){
  if(builtDoc) builtDoc.save(builtDoc._fname || 'legado.pdf');
}

// 事件
$('#btnShelf').addEventListener('click', loadShelf);
$('#btnChapters').addEventListener('click', loadChapters);
$('#btnAll').addEventListener('click', ()=>{
  document.querySelectorAll('#chList input').forEach(cb=>{cb.checked=true; SELECTED.add(+cb.dataset.i);});
});
$('#btnNone').addEventListener('click', ()=>{
  document.querySelectorAll('#chList input').forEach(cb=>{cb.checked=false;});
  SELECTED.clear();
});
$('#btnRange').addEventListener('click', ()=>{
  const a=parseInt($('#rangeFrom').value,10), b=parseInt($('#rangeTo').value,10);
  if(isNaN(a)||isNaN(b)){ setStatus('范围请输入数字'); return; }
  const lo=Math.min(a,b)-1, hi=Math.max(a,b)-1;
  document.querySelectorAll('#chList input').forEach(cb=>{
    const i=+cb.dataset.i;
    if(i>=lo && i<=hi){ cb.checked=true; SELECTED.add(i); } else { cb.checked=false; SELECTED.delete(i); }
  });
  setStatus('已选第 '+Math.min(a,b)+'~'+Math.max(a,b)+' 话。');
});
$('#btnBuild').addEventListener('click', build);
$('#btnReDL').addEventListener('click', reDownloadBroken);
$('#fab').addEventListener('click', save);
</script>
</body>
</html>
