<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Zip2PDF">
  <title>ZIP 转 PDF</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "PingFang SC", sans-serif;
      background: #f3f4f6; padding: 24px 16px; }
    h1 { text-align: center; color: #1f2937; margin-bottom: 4px; font-size: 22px; }
    p.tip { text-align: center; color: #6b7280; font-size: 13px; margin-bottom: 20px; }
    .card { background: #fff; border-radius: 16px; padding: 24px;
      max-width: 480px; margin: 0 auto 20px; box-shadow: 0 4px 12px rgba(0,0,0,.08); }
    #fileInput, #imgInput { display: none; }
    .btn { display: inline-block; background: #4f46e5; color: #fff; border: none;
      border-radius: 12px; padding: 12px 22px; font-size: 15px; cursor: pointer; }
    .btn:disabled { background: #9ca3af; }
    .btn.small { padding: 7px 12px; font-size: 13px; border-radius: 8px; }
    .btn.danger { background: #dc2626; }
    .btn.gray { background: #6b7280; }
    #status { margin-top: 14px; color: #374151; font-size: 14px; min-height: 20px; }
    .bar-wrap { margin-top: 14px; display: none; }
    .bar { height: 10px; background: #e5e7eb; border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; width: 0%; border-radius: 999px;
      background: linear-gradient(90deg, #818cf8, #4f46e5); transition: width .12s linear; }
    #progressText { margin-top: 6px; font-size: 13px; color: #4b5563; }
    .hint { font-size: 12px; color: #9ca3af; margin-top: 10px; }
    h2 { font-size: 17px; color: #1f2937; margin-bottom: 12px; }
    .opt { display: flex; align-items: center; gap: 10px; font-size: 15px; color: #1f2937; }
    .opt input { width: 20px; height: 20px; accent-color: #4f46e5; }
    .item { border-bottom: 1px solid #e5e7eb; padding: 10px 0; }
    .item .name { font-size: 14px; color: #1f2937; word-break: break-all; font-weight: 600; }
    .item .meta { font-size: 12px; color: #9ca3af; margin: 4px 0 8px; }
    .item .ops { display: flex; gap: 8px; flex-wrap: wrap; }
    .mask { position: fixed; inset: 0; background: rgba(17,24,39,.5);
      display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
    .dialog { background: #fff; border-radius: 16px; padding: 22px; width: 100%; max-width: 360px; }
    .dialog h3 { font-size: 17px; color: #1f2937; margin-bottom: 10px; }
    .dialog p { font-size: 13px; color: #6b7280; line-height: 1.7; }
    .dialog-ops { display: flex; gap: 10px; margin-top: 18px; }
    .dialog-ops .btn { flex: 1; text-align: center; }
    .empty { color: #9ca3af; font-size: 14px; text-align: center; padding: 16px 0; }
    .item { cursor: pointer; border-radius: 10px; padding-left: 8px; padding-right: 8px; }
    .item.sel { background: #eef2ff; box-shadow: inset 0 0 0 1px #c7d2fe; }
    .pickrow { display: flex; align-items: flex-start; gap: 10px; }
    .pickrow input { width: 20px; height: 20px; margin-top: 1px;
      accent-color: #4f46e5; pointer-events: none; flex: none; }
    .pickrow .name { flex: 1; min-width: 0; }
    .bulk { margin-top: 14px; padding-top: 14px; border-top: 1px solid #e5e7eb; display: none; }
    .bulk.show { display: block; }
    .bulk-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .selcount { font-size: 13px; color: #6b7280; }
    .bulk-ops { display: flex; gap: 8px; flex-wrap: wrap; }
    .bulk-ops .btn:disabled { background: #d1d5db; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>📷 ZIP 转 PDF</h1>
  <p class="tip">支持 jpg / png / webp / bmp / gif / avif / svg<br>文件夹按顺序对应话数 · 可合并为一个 PDF · 可重命名</p>

  <div class="card">
    <input type="file" id="fileInput" accept=".zip,application/zip,application/x-zip-compressed">
    <input type="file" id="imgInput" accept="image/*" multiple>
    <button class="btn" onclick="document.getElementById('fileInput').click()">📦 ZIP 文件</button>
    <button class="btn gray" style="margin-left:8px"
            onclick="document.getElementById('imgInput').click()">🖼️ 图片文件</button>
    <div class="opt" style="margin-top:14px">
      <input type="checkbox" id="mergeChk" checked>
      <label for="mergeChk">合并 ZIP 内所有文件夹为一个 PDF</label>
    </div>
    <div style="margin-top:4px">
      <span style="font-size:12px;color:#9ca3af;margin-left:30px">
        不勾选时，每个文件夹生成一个 PDF，按 zip 文件名中的起始数字命名为「第X话」
      </span>
    </div>
    <div class="bar-wrap" id="barWrap">
      <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      <div id="progressText"></div>
    </div>
    <div id="status"></div>
    <div class="hint">单个 ZIP / 一次选择的图片合计不超过 500&nbsp;MB</div>
  </div>

  <div class="card">
    <h2>📤 上传记录</h2>
    <div id="uploads"></div>
    <div class="bulk" id="upBulk">
      <div class="bulk-top">
        <button class="btn small gray" id="upAll">全选</button>
        <span class="selcount" id="upCount">已选 0 条</span>
      </div>
      <div class="bulk-ops">
        <button class="btn small danger" id="upDelete">删除记录</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>我的 PDF 库</h2>
    <div id="library"></div>
    <div class="bulk" id="pdfBulk">
      <div class="bulk-top">
        <button class="btn small gray" id="pdfAll">全选</button>
        <span class="selcount" id="pdfCount">已选 0 个</span>
      </div>
      <div class="bulk-ops">
        <button class="btn small" id="pdfShare">打开 LocalSend</button>
        <button class="btn small gray" id="pdfRename">重命名</button>
        <button class="btn small gray" id="pdfDownload">下载</button>
        <button class="btn small danger" id="pdfDelete">删除</button>
      </div>
    </div>
  </div>

  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script>
    let db = null;

    // ============ 依赖库兜底加载 ============
    // 优先用随页面一起上传的 vendor/ 本地库；若缺失（例如上传时漏了该目录）
    // 则自动回退到公共 CDN，保证在任何静态空间都能跑起来。
    const LIBS = [
      {
        name: 'JSZip',
        ok: () => typeof JSZip !== 'undefined',
        local: 'vendor/jszip.min.js',
        cdn: 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'
      },
      {
        name: 'jsPDF',
        ok: () => !!(window.jspdf && window.jspdf.jsPDF),
        local: 'vendor/jspdf.umd.min.js',
        cdn: 'https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js'
      }
    ];
    function loadScript(src) {
      return new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = src; s.onload = res; s.onerror = () => rej(new Error(src));
        document.head.appendChild(s);
      });
    }
    async function ensureLibs() {
      for (const lib of LIBS) {
        if (lib.ok()) continue;
        try { await loadScript(lib.local); } catch (e) { /* 本地缺失 */ }
        if (lib.ok()) continue;
        try { await loadScript(lib.cdn); } catch (e) { /* CDN 也失败 */ }
      }
    }

    // 依赖库自检（本地 vendor 加载失败时给出明确提示）
    function checkLibs() {
      const missing = [];
      if (typeof JSZip === 'undefined') missing.push('JSZip');
      if (!window.jspdf || !window.jspdf.jsPDF) missing.push('jsPDF');
      if (missing.length) {
        document.getElementById('status').innerHTML =
          '<span style="color:#dc2626">⚠️ 依赖库加载失败：' + missing.join('、') +
          '<br>请确认 vendor/ 目录已随网页一起上传（GitHub Pages 需包含该文件夹）</span>';
        return false;
      }
      return true;
    }

    // ================= IndexedDB 存储 =================
    function openDB() {
      return new Promise((res, rej) => {
        const req = indexedDB.open('zip2pdf', 2);   // v2 起新增 uploads（上传记录）
        req.onupgradeneeded = () => {
          const database = req.result;
          if (!database.objectStoreNames.contains('pdfs')) {
            database.createObjectStore('pdfs', { keyPath: 'id' });
          }
          if (!database.objectStoreNames.contains('uploads')) {
            database.createObjectStore('uploads', { keyPath: 'id' });
          }
        };
        req.onsuccess = () => res(req.result);
        req.onerror = rej;
      });
    }
    async function dbPut(record) {
      return new Promise((res, rej) => {
        const tx = db.transaction('pdfs', 'readwrite');
        tx.objectStore('pdfs').put(record);
        tx.oncomplete = res; tx.onerror = rej;
      });
    }
    async function dbAll() {
      return new Promise((res, rej) => {
        const req = db.transaction('pdfs').objectStore('pdfs').getAll();
        req.onsuccess = () => res(req.result); req.onerror = rej;
      });
    }
    async function dbDelete(id) {
      return new Promise((res, rej) => {
        const tx = db.transaction('pdfs', 'readwrite');
        tx.objectStore('pdfs').delete(id);
        tx.oncomplete = res; tx.onerror = rej;
      });
    }

    // ---------- 上传记录（uploads）----------
    async function dbPutUpload(record) {
      return new Promise((res, rej) => {
        const tx = db.transaction('uploads', 'readwrite');
        tx.objectStore('uploads').put(record);
        tx.oncomplete = res; tx.onerror = rej;
      });
    }
    async function dbAllUploads() {
      return new Promise((res, rej) => {
        const req = db.transaction('uploads').objectStore('uploads').getAll();
        req.onsuccess = () => res(req.result); req.onerror = rej;
      });
    }
    async function dbDeleteUpload(id) {
      return new Promise((res, rej) => {
        const tx = db.transaction('uploads', 'readwrite');
        tx.objectStore('uploads').delete(id);
        tx.oncomplete = res; tx.onerror = rej;
      });
    }

    // ================= 分组：按顶层文件夹分组 =================
    // 支持的图片扩展名（浏览器 canvas 可解码的都列入；
    // heic/tiff 等无法原生解码的格式会被识别并在转换时跳过并提示）
    const IMAGE_RE = /\.(jpe?g|jpe|png|webp|bmp|gif|avif|ico|svg|tiff?|heic|heif)$/i;

    function groupByFolder(zip) {
      const groups = new Map();
      const entries = Object.values(zip.files).filter(f => !f.dir);
      for (const f of entries) {
        if (!IMAGE_RE.test(f.name)) continue;
        // 跳过 macOS 打包产生的缩略图与隐藏文件
        if (/__MACOSX/i.test(f.name) || /(^|\/)\.[^/]/.test(f.name)) continue;
        const parts = f.name.split('/');
        const folder = parts.length > 1 ? parts[0] : '';
        if (!groups.has(folder)) groups.set(folder, []);
        groups.get(folder).push(f);
      }
      const keys = [...groups.keys()];
      // 文件夹名全是纯数字时按数值排序（乱码不影响）
      if (keys.every(k => k === '' || /^\d+$/.test(k))) {
        keys.sort((a, b) => (a === '' ? -1 : b === '' ? 1 : Number(a) - Number(b)));
      }
      // 每个文件夹内图片按数字排序：0.jpg, 1.jpg, … 20.jpg
      return keys.map(k => ({
        folder: k,
        images: groups.get(k).sort((a, b) =>
          a.name.localeCompare(b.name, undefined, { numeric: true }))
      }));
    }

    // ================= 从 zip 文件名解析起始话数 =================
    // 11-15.zip → 11；108.zip → 108；无数字 → null
    function parseStartChapter(zipBaseName) {
      const m = zipBaseName.match(/\d+/);
      return m ? parseInt(m[0], 10) : null;
    }

    // 统一输出质量（canvas 重编码用，0.92 肉眼几乎无损且体积可控）
    const JPEG_QUALITY = 0.92;

    // ================= 把任意浏览器可解码的图片转成 JPEG dataURL =================
    // 1) 白底填充：PNG/WebP/GIF 的透明区域转成 JPEG 后不会变黑
    // 2) 统一成 JPEG：jsPDF 用 DCTDecode 嵌入，体积最小、兼容性最好
    function toJpegDataURL(blob) {
      return new Promise((res, rej) => {
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          try {
            // SVG 未声明尺寸时浏览器会给出 0，兜底为 1024
            const w = img.naturalWidth || 1024;
            const h = img.naturalHeight || 1024;
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            const g = c.getContext('2d');
            g.fillStyle = '#ffffff';
            g.fillRect(0, 0, w, h);
            g.drawImage(img, 0, 0, w, h);
            const dataUrl = c.toDataURL('image/jpeg', JPEG_QUALITY);
            // 超大图在 iOS 上可能导出失败，返回近乎空串
            if (!dataUrl || dataUrl.length < 200) {
              rej(new Error('图片过大，浏览器无法处理'));
            } else {
              res({ dataUrl, width: w, height: h });
            }
          } catch (err) { rej(err); }
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          rej(new Error('浏览器无法解码该图片格式'));
        };
        img.src = url;
      });
    }

    // ================= 生成一个 PDF =================
    // 返回 { blob, skipped }：skipped 为解码失败被跳过的文件名
    async function buildPDF(images, onProgress) {
      const jsPDF = window.jspdf && window.jspdf.jsPDF;
      if (!jsPDF) throw new Error('jsPDF 未加载，请检查 vendor/jspdf.umd.min.js');
      let doc = null;
      const skipped = [];
      for (let i = 0; i < images.length; i++) {
        onProgress(i);
        let out;
        try {
          const blob = await images[i].async('blob');
          out = await toJpegDataURL(blob);
        } catch (err) {
          skipped.push(images[i].name);
          continue;
        }
        const orient = out.width >= out.height ? 'landscape' : 'portrait';
        if (!doc) {
          doc = new jsPDF({ orientation: orient, unit: 'px', format: [out.width, out.height] });
        } else {
          doc.addPage([out.width, out.height], orient);
        }
        doc.addImage(out.dataUrl, 'JPEG', 0, 0, out.width, out.height);
      }
      if (!doc) throw new Error('没有可用的图片（格式可能全部不被支持）');
      return { blob: doc.output('blob'), skipped };
    }

    // ================= 大小限制与进度条 =================
    const MAX_BYTES = 500 * 1024 * 1024;   // 上传上限 500 MB
    const MAX_LABEL = '500 MB';
    // 单个 PDF 的提醒阈值（只是提示，不阻止生成）
    const BIG_PDF_BYTES = 200 * 1024 * 1024;
    const BIG_PDF_LABEL = '200 MB';

    function fmtSize(bytes) {
      if (bytes >= 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      return Math.max(1, Math.round(bytes / 1024)) + ' KB';
    }

    // percent: 0~100；label: 当前阶段说明
    function setProgress(percent, label) {
      document.getElementById('barWrap').style.display = 'block';
      document.getElementById('barFill').style.width =
        Math.max(0, Math.min(100, percent)).toFixed(1) + '%';
      document.getElementById('progressText').textContent = label || '';
    }
    function hideProgress() {
      document.getElementById('barWrap').style.display = 'none';
    }

    // 读取文件并回报真实读取进度（FileReader.onprogress）
    function readFileWithProgress(file, onProgress) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
        r.onload = () => res(r.result);
        r.onerror = () => rej(new Error('文件读取失败'));
        r.readAsArrayBuffer(file);
      });
    }

    // ================= 被跳过的图片的提示文案 =================
    function skippedNote(skipped) {
      if (!skipped || !skipped.length) return '';
      const heic = skipped.filter(n => /\.hei[cf]$/i.test(n)).length;
      if (heic) {
        return `｜跳过 ${skipped.length} 张（含 ${heic} 张 HEIC/HEIF，浏览器无法解码，请先转成 JPG）`;
      }
      return `｜跳过 ${skipped.length} 张无法解码的图片`;
    }

    // ================= 转换主流程 =================
    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file) return;
      await ensureLibs();
      if (!checkLibs()) return;

      const status = document.getElementById('status');
      // ===== 500 MB 上限 =====
      if (file.size > MAX_BYTES) {
        hideProgress();
        status.innerHTML = '<span style="color:#dc2626">⚠️ 文件 ' + fmtSize(file.size) +
          ' 超过 ' + MAX_LABEL + ' 上限，请拆分压缩包后再上传</span>';
        await addUpload({
          name: file.name, size: file.size, kind: 'zip',
          note: '超过 ' + MAX_LABEL + ' 上限，未转换', ok: false
        });
        return;
      }

      const merge = document.getElementById('mergeChk').checked;
      setProgress(0, '读取文件中…（' + fmtSize(file.size) + '）');
      status.textContent = '';
      try {
        // 阶段一：读取文件（真实进度，占前 15%）
        const buf = await readFileWithProgress(file, p => {
          setProgress(p * 15, '读取文件中… ' + Math.round(p * 100) + '%（' + fmtSize(file.size) + '）');
        });
        setProgress(15, '解析压缩包…');
        const zip = await JSZip.loadAsync(buf);
        const groups = groupByFolder(zip);
        const totalImages = groups.reduce((s, g) => s + g.images.length, 0);
        if (!totalImages) {
          hideProgress();
          status.textContent = 'ZIP 里没有找到图片（支持 jpg/png/webp/bmp/gif/avif/svg 等）';
          await addUpload({
            name: file.name, size: file.size, kind: 'zip',
            detail: '0 张图片', note: status.textContent, ok: false
          });
          return;
        }

        const baseName = file.name.replace(/\.zip$/i, '');
        const startChapter = parseStartChapter(baseName);
        let convDone = 0;      // 跨 PDF 累计已处理页数，用于总体进度
        let allSkipped = [];

        if (merge) {
          // ===== 合并模式：所有文件夹 → 一个 PDF，名字 = zip 名 =====
          const allImages = groups.flatMap(g => g.images);
          const { blob: pdfBlob, skipped } = await buildPDF(allImages, (i) => {
            setProgress(15 + (i + 1) / allImages.length * 85,
              '转换图片 ' + (i + 1) + '/' + allImages.length);
          });
          allSkipped = skipped;
          await dbPut({
            id: Date.now() + '',
            name: `${baseName}.pdf`,
            size: pdfBlob.size,
            createdAt: new Date().toLocaleString('zh-CN'),
            sent: false,
            blob: pdfBlob
          });
          setProgress(100, '完成 ✔');
          status.textContent =
            `已合并为 1 个 PDF（共 ${allImages.length - skipped.length} 页）` +
            skippedNote(skipped);
          await addUpload({
            name: file.name, size: file.size, kind: 'zip',
            detail: totalImages + ' 张图片 · ' + groups.length + ' 个文件夹',
            result: '1 个 PDF · ' + (allImages.length - skipped.length) + ' 页', ok: true
          });
        } else {
          // ===== 分话模式：每个文件夹 → 第X话.pdf =====
          for (let gi = 0; gi < groups.length; gi++) {
            const g = groups[gi];
            const pdfName = startChapter !== null && groups.length > 1
              ? `第${startChapter + gi}话.pdf`
              : (groups.length > 1 ? `${baseName}-${gi + 1}.pdf` : `${baseName}.pdf`);

            const { blob: pdfBlob, skipped } = await buildPDF(g.images, () => {
              convDone++;
              setProgress(15 + convDone / totalImages * 85,
                '转换中 ' + convDone + '/' + totalImages +
                '（第 ' + (gi + 1) + '/' + groups.length + ' 个 PDF）');
            });
            allSkipped = allSkipped.concat(skipped);

            await dbPut({
              id: Date.now() + '-' + gi,
              name: pdfName,
              size: pdfBlob.size,
              createdAt: new Date().toLocaleString('zh-CN'),
              sent: false,
              blob: pdfBlob
            });
            renderLibrary();
          }
          setProgress(100, '全部完成 ✔');
          status.textContent =
            `共生成 ${groups.length} 个 PDF` + skippedNote(allSkipped);
          await addUpload({
            name: file.name, size: file.size, kind: 'zip',
            detail: totalImages + ' 张图片 · ' + groups.length + ' 个文件夹',
            result: groups.length + ' 个 PDF', ok: true
          });
        }
        renderLibrary();
      } catch (err) {
        status.textContent = '出错了：' + err.message;
        await addUpload({
          name: file.name, size: file.size, kind: 'zip',
          note: err.message, ok: false
        });
      }
    });

    // ================= 直接选图片 → 合成一个 PDF =================
    document.getElementById('imgInput').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []);
      e.target.value = '';
      if (!files.length) return;
      await ensureLibs();
      if (!checkLibs()) return;
      const status = document.getElementById('status');

      // ===== 500 MB 上限（按本次选择的总大小）=====
      const totalBytes = files.reduce((s, f) => s + f.size, 0);
      if (totalBytes > MAX_BYTES) {
        hideProgress();
        status.innerHTML = '<span style="color:#dc2626">⚠️ 所选图片合计 ' + fmtSize(totalBytes) +
          ' 超过 ' + MAX_LABEL + ' 上限，请少选一些</span>';
        await addUpload({
          name: files.length + ' 张图片', size: totalBytes, kind: 'images',
          detail: files.length + ' 张', note: '超过 ' + MAX_LABEL + ' 上限，未转换', ok: false
        });
        return;
      }

      setProgress(0, '准备中…（' + files.length + ' 张，' + fmtSize(totalBytes) + '）');
      status.textContent = '';
      try {
        // 按文件名自然排序，保证 1.jpg / 2.jpg / 10.jpg 顺序正确
        files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
        // 包装成与 JSZip 条目一致的结构，复用 buildPDF
        const items = files.map(f => ({ name: f.name, async: () => Promise.resolve(f) }));
        const { blob: pdfBlob, skipped } = await buildPDF(items, (i) => {
          setProgress((i + 1) / items.length * 100, '转换图片 ' + (i + 1) + '/' + items.length);
        });
        const d = new Date();
        const pad = n => String(n).padStart(2, '0');
        await dbPut({
          id: 'img-' + Date.now(),
          name: `图片_${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.pdf`,
          size: pdfBlob.size,
          createdAt: d.toLocaleString('zh-CN'),
          sent: false,
          blob: pdfBlob
        });
        setProgress(100, '完成 ✔');
        status.textContent =
          `${items.length - skipped.length} 张图已合成 1 个 PDF` + skippedNote(skipped);
        await addUpload({
          name: files.length + ' 张图片', size: totalBytes, kind: 'images',
          detail: files.length + ' 张',
          result: '1 个 PDF · ' + (items.length - skipped.length) + ' 页', ok: true
        });
        renderLibrary();
      } catch (err) {
        status.textContent = '出错了：' + err.message;
        await addUpload({
          name: files.length + ' 张图片', size: totalBytes, kind: 'images',
          detail: files.length + ' 张', note: err.message, ok: false
        });
      }
    });

    // ================= 上传记录 =================
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // info: { name, size, kind:'zip'|'images', detail?, result?, note?, ok }
    async function addUpload(info) {
      await dbPutUpload({
        id: 'u-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
        name: info.name,
        size: info.size,
        kind: info.kind,
        detail: info.detail || '',
        result: info.result || '',
        note: info.note || '',
        ok: !!info.ok,
        createdAt: new Date().toLocaleString('zh-CN')
      });
      renderUploads();
    }

    async function renderUploads() {
      const list = await dbAllUploads();
      const el = document.getElementById('uploads');
      const bulk = document.getElementById('upBulk');
      if (!list.length) {
        el.innerHTML = '<div class="empty">还没有上传记录</div>';
        if (bulk) bulk.classList.remove('show');
        selUploads.clear();
        return;
      }
      el.innerHTML = '';
      list.sort((a, b) => (b.id + '').localeCompare(a.id + '', undefined, { numeric: true }))
        .forEach(rec => {
          const div = document.createElement('div');
          const on = selUploads.has(rec.id);
          div.className = 'item' + (on ? ' sel' : '');
          const icon = rec.kind === 'zip' ? '📦' : '🖼️';
          const badge = rec.ok
            ? '<span style="color:#059669">✅ ' + escapeHtml(rec.result || '成功') + '</span>'
            : '<span style="color:#dc2626">❌ ' + escapeHtml(rec.note || '失败') + '</span>';
          div.innerHTML =
            '<div class="pickrow">' +
              '<input type="checkbox"' + (on ? ' checked' : '') + '>' +
              '<span class="name">' + icon + ' ' + escapeHtml(rec.name) + '</span>' +
            '</div>' +
            '<div class="meta">' + rec.createdAt + ' · ' + fmtSize(rec.size) +
              (rec.detail ? ' · ' + escapeHtml(rec.detail) : '') + '</div>' +
            '<div class="meta">' + badge + '</div>';
          div.onclick = () => {
            selUploads.has(rec.id) ? selUploads.delete(rec.id) : selUploads.add(rec.id);
            renderUploads();
          };
          el.appendChild(div);
        });
      updateBulkBar('up', list.length);
    }

    // ================= 多选状态 =================
    const selPdfs = new Set();
    const selUploads = new Set();

    // 更新列表底部的操作栏：显示已选数量、控制按钮可用性
    function updateBulkBar(kind, total) {
      const prefix = kind === 'up' ? 'up' : 'pdf';
      const bulk = document.getElementById(prefix + 'Bulk');
      const count = document.getElementById(prefix + 'Count');
      const set = kind === 'up' ? selUploads : selPdfs;
      if (!bulk || !count) return;
      if (!total) { bulk.classList.remove('show'); return; }
      bulk.classList.add('show');
      const n = set.size;
      count.textContent = kind === 'up'
        ? (n ? '已选 ' + n + ' 条' : '共 ' + total + ' 条')
        : (n ? '已选 ' + n + ' 个' : '共 ' + total + ' 个');
      document.getElementById(prefix + 'All').textContent = n === total ? '取消全选' : '全选';
      if (kind === 'pdf') {
        document.getElementById('pdfShare').disabled = n === 0;
        document.getElementById('pdfDownload').disabled = n === 0;
        document.getElementById('pdfDelete').disabled = n === 0;
        document.getElementById('pdfRename').disabled = n !== 1;   // 重命名只能单个
      } else {
        document.getElementById('upDelete').disabled = n === 0;
      }
    }

    // ================= PDF 库列表 =================
    async function renderLibrary() {
      const list = await dbAll();
      const el = document.getElementById('library');
      if (!list.length) {
        el.innerHTML = '<div class="empty">还没有 PDF，先转换一个 ZIP 吧</div>';
        selPdfs.clear();
        updateBulkBar('pdf', 0);
        return;
      }
      el.innerHTML = '';
      list.sort((a, b) => (b.id + '').localeCompare(a.id + '', undefined, { numeric: true }))
          .forEach(rec => {
        const div = document.createElement('div');
        const on = selPdfs.has(rec.id);
        div.className = 'item' + (on ? ' sel' : '');
        // 单个 PDF 过大只是提醒，不阻止生成
        const bigWarn = rec.size > BIG_PDF_BYTES
          ? '<div class="meta" style="color:#dc2626">⚠️ 超过 ' + BIG_PDF_LABEL +
            '：多数邮箱附件和在线上传都有此限制，建议拆成多个 PDF</div>'
          : '';
        div.innerHTML =
          '<div class="pickrow">' +
            '<input type="checkbox"' + (on ? ' checked' : '') + '>' +
            '<span class="name">' + escapeHtml(rec.name) + '</span>' +
          '</div>' +
          '<div class="meta">' + rec.createdAt + ' · ' +
            (rec.size / 1024 / 1024).toFixed(2) + ' MB' +
            ' · ' + (rec.sent ? '✅ 已分享' : '⬜ 未分享') + '</div>' +
          bigWarn;
        div.onclick = () => {
          selPdfs.has(rec.id) ? selPdfs.delete(rec.id) : selPdfs.add(rec.id);
          renderLibrary();
        };
        el.appendChild(div);
      });
      updateBulkBar('pdf', list.length);
    }

    // ================= 重命名 =================
    async function rename(rec) {
      const newName = prompt('输入新的文件名（可不含 .pdf 后缀，会自动补上）：', rec.name);
      if (!newName || !newName.trim()) return;
      let name = newName.trim();
      if (!/\.pdf$/i.test(name)) name += '.pdf';
      await dbPut({ ...rec, name });
      renderLibrary();
    }

    // ================= 通用确认弹窗 =================
    // 返回 Promise<boolean>：点确定 true，取消 / 点遮罩 false
    function askConfirm(opts) {
      return new Promise(res => {
        const mask = document.createElement('div');
        mask.className = 'mask';
        mask.innerHTML =
          '<div class="dialog">' +
            '<h3></h3><p></p>' +
            '<div class="dialog-ops">' +
              '<button class="btn gray" data-act="no"></button>' +
              '<button class="btn" data-act="yes"></button>' +
            '</div>' +
          '</div>';
        mask.querySelector('h3').textContent = opts.title || '';
        mask.querySelector('p').innerHTML = opts.message || '';
        mask.querySelector('[data-act=no]').textContent = opts.cancelText || '取消';
        mask.querySelector('[data-act=yes]').textContent = opts.okText || '确定';
        document.body.appendChild(mask);
        mask.style.display = 'flex';

        const close = v => { mask.remove(); res(v); };
        mask.querySelector('[data-act=no]').onclick = () => close(false);
        mask.querySelector('[data-act=yes]').onclick = () => close(true);
        mask.onclick = e => { if (e.target === mask) close(false); };
      });
    }

    // ================= 分享到其它 App（LocalSend 等）=================
    // 用 Web Share API 拉起系统分享面板，再手动选择 LocalSend 接收。
    // 两个硬性条件：① 页面必须是 HTTPS ② 必须由用户点击直接触发（不能放在 await 之后）。
    // 文件不会先落到「下载」文件夹，而是直接交给系统面板。
    // recs: 一条或多条 PDF 记录（Web Share 支持一次分享多个文件）
    async function shareFiles(recs) {
      if (!recs || !recs.length) return;
      const status = document.getElementById('status');
      const files = recs.map(r => new File([r.blob], r.name, { type: 'application/pdf' }));
      let shareErr = null;

      // canShare() 只接受 files 属性，且只在它明确返回 false 时才放弃
      const blocked = !!(navigator.canShare && navigator.canShare({ files }) === false);

      // ⚠️ 只尝试一次，绝不重试：share() 会消耗用户手势，重试必抛 NotAllowedError
      if (navigator.share && !blocked) {
        try {
          await navigator.share({
            files,
            title: recs.length === 1 ? recs[0].name : recs.length + ' 个 PDF'
          });
          for (const r of recs) await dbPut({ ...r, sent: true });
          renderLibrary();
          return;
        } catch (e) {
          if (e.name === 'AbortError') return;   // 用户在面板里取消
          shareErr = e;
        }
      }

      // 先弹窗说明情况，由用户自己决定要不要下载，不擅自落文件
      const wantDownload = await askConfirm({
        title: '无法调起系统分享面板',
        message: '当前浏览器不支持直接分享文件。' +
          (shareErr ? '<br>原因：' + escapeHtml(shareErr.name || '未知') : '') +
          '<br><br>是否改为<b>下载到本机</b>？',
        okText: '直接下载',
        cancelText: '取消'
      });

      if (!wantDownload) {
        status.textContent = '已取消，未下载。';
        return;
      }

      for (const r of recs) {
        download(r);
        await new Promise(res => setTimeout(res, 400));  // 多个下载之间留点间隔
      }
      status.textContent = '已下载 ' + recs.length + ' 个文件到本机。';
      for (const r of recs) await dbPut({ ...r, sent: true });
      renderLibrary();
    }

    // ================= 下载 / 删除 =================
    function download(rec) {
      const url = URL.createObjectURL(rec.blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = rec.name;
      document.body.appendChild(a);
      a.click();
      // 延迟释放，立即 revoke 会导致部分浏览器下载失败
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 5000);
    }

    // ================= 批量操作（底部操作栏）=================
    async function selectedPdfs() {
      const list = await dbAll();
      return list.filter(r => selPdfs.has(r.id));
    }
    async function selectedUploads() {
      const list = await dbAllUploads();
      return list.filter(r => selUploads.has(r.id));
    }

    function bindBulk() {
      // ---- PDF 库 ----
      document.getElementById('pdfAll').onclick = async () => {
        const list = await dbAll();
        if (selPdfs.size === list.length) selPdfs.clear();
        else list.forEach(r => selPdfs.add(r.id));
        renderLibrary();
      };
      document.getElementById('pdfShare').onclick = async () => {
        shareFiles(await selectedPdfs());
      };
      document.getElementById('pdfDownload').onclick = async () => {
        const recs = await selectedPdfs();
        for (const r of recs) {
          download(r);
          await new Promise(res => setTimeout(res, 400));  // 多个下载间留间隔
        }
        document.getElementById('status').textContent = '已下载 ' + recs.length + ' 个文件。';
      };
      document.getElementById('pdfRename').onclick = async () => {
        const recs = await selectedPdfs();
        if (recs.length === 1) rename(recs[0]);
      };
      document.getElementById('pdfDelete').onclick = async () => {
        const recs = await selectedPdfs();
        if (!recs.length) return;
        const okd = await askConfirm({
          title: '删除所选 PDF',
          message: '将删除选中的 <b>' + recs.length + '</b> 个 PDF（App 内副本）。<br>' +
            '已下载到手机里的原件请自行删除。',
          okText: '删除', cancelText: '取消'
        });
        if (!okd) return;
        for (const r of recs) { await dbDelete(r.id); selPdfs.delete(r.id); }
        renderLibrary();
      };

      // ---- 上传记录 ----
      document.getElementById('upAll').onclick = async () => {
        const list = await dbAllUploads();
        if (selUploads.size === list.length) selUploads.clear();
        else list.forEach(r => selUploads.add(r.id));
        renderUploads();
      };
      document.getElementById('upDelete').onclick = async () => {
        const recs = await selectedUploads();
        if (!recs.length) return;
        const okd = await askConfirm({
          title: '删除上传记录',
          message: '将删除选中的 <b>' + recs.length + '</b> 条记录（不影响已生成的 PDF）。',
          okText: '删除', cancelText: '取消'
        });
        if (!okd) return;
        for (const r of recs) { await dbDeleteUpload(r.id); selUploads.delete(r.id); }
        renderUploads();
      };
    }

    // ================= 初始化 =================
    (async () => {
      await ensureLibs();
      checkLibs();
      // 清理旧版本遗留的 Kindle 邮箱设置
      try { localStorage.removeItem('zip2pdf.kindleEmail'); } catch (e) {}
      try {
        db = await openDB();
        bindBulk();
        renderUploads();
        renderLibrary();
      } catch (e) {
        // file:// 直接打开、或隐私模式下 IndexedDB 可能不可用
        const tip = '<div class="empty">⚠️ 本地存储不可用（请用 http/https 网址访问，不要直接双击打开文件）</div>';
        document.getElementById('uploads').innerHTML = tip;
        document.getElementById('library').innerHTML = tip;
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    })();
  </script>
</body>
</html>
