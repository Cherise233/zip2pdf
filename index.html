<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.json">
  <title>ZIP 转 PDF</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "PingFang SC", sans-serif;
      background: #f3f4f6; padding: 24px 16px; }
    h1 { text-align: center; color: #1f2937; margin-bottom: 4px; font-size: 22px; }
    p.tip { text-align: center; color: #6b7280; font-size: 13px; margin-bottom: 20px; }
    .card { background: #fff; border-radius: 16px; padding: 24px;
      max-width: 480px; margin: 0 auto 20px; box-shadow: 0 4px 12px rgba(0,0,0,.08); }
    #fileInput { display: none; }
    .btn { display: inline-block; background: #4f46e5; color: #fff; border: none;
      border-radius: 12px; padding: 12px 22px; font-size: 15px; cursor: pointer; }
    .btn:disabled { background: #9ca3af; }
    .btn.small { padding: 7px 12px; font-size: 13px; border-radius: 8px; }
    .btn.danger { background: #dc2626; }
    .btn.gray { background: #6b7280; }
    #status { margin-top: 14px; color: #374151; font-size: 14px; min-height: 20px; }
    .bar-wrap { margin-top: 14px; display: none; }
    .bar { height: 10px; background: #e5e7eb; border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; width: 0%; border-radius: 999px;
      background: linear-gradient(90deg, #818cf8, #4f46e5); transition: width .12s linear; }
    #progressText { margin-top: 6px; font-size: 13px; color: #4b5563; }
    .hint { font-size: 12px; color: #9ca3af; margin-top: 10px; }
    h2 { font-size: 17px; color: #1f2937; margin-bottom: 12px; }
    .opt { display: flex; align-items: center; gap: 10px; font-size: 15px; color: #1f2937; }
    .opt input { width: 20px; height: 20px; accent-color: #4f46e5; }
    .item { border-bottom: 1px solid #e5e7eb; padding: 10px 0; }
    .item .name { font-size: 14px; color: #1f2937; word-break: break-all; font-weight: 600; }
    .item .meta { font-size: 12px; color: #9ca3af; margin: 4px 0 8px; }
    .item .ops { display: flex; gap: 8px; flex-wrap: wrap; }
    .empty { color: #9ca3af; font-size: 14px; text-align: center; padding: 16px 0; }
  </style>
</head>
<body>
  <h1>📷 ZIP 转 PDF</h1>
  <p class="tip">支持 jpg / png / webp / bmp / gif / avif / svg<br>文件夹按顺序对应话数 · 可合并为一个 PDF · 可重命名</p>

  <div class="card">
    <input type="file" id="fileInput" accept=".zip,application/zip,application/x-zip-compressed">
    <input type="file" id="imgInput" accept="image/*" multiple>
    <button class="btn" onclick="document.getElementById('fileInput').click()">选择 ZIP 文件</button>
    <button class="btn gray" style="margin-left:8px"
            onclick="document.getElementById('imgInput').click()">或直接选图片</button>
    <div class="opt" style="margin-top:14px">
      <input type="checkbox" id="mergeChk" checked>
      <label for="mergeChk">合并 ZIP 内所有文件夹为一个 PDF</label>
    </div>
    <div style="margin-top:4px">
      <span style="font-size:12px;color:#9ca3af;margin-left:30px">
        不勾选时，每个文件夹生成一个 PDF，按 zip 文件名中的起始数字命名为「第X话」
      </span>
    </div>
    <div class="bar-wrap" id="barWrap">
      <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      <div id="progressText"></div>
    </div>
    <div id="status"></div>
    <div class="hint">单个 ZIP / 一次选择的图片合计不超过 200&nbsp;MB</div>
  </div>

  <div class="card">
    <h2>我的 PDF 库</h2>
    <div id="library"></div>
  </div>

  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script>
    let db = null;

    // ============ 依赖库兜底加载 ============
    // 优先用随页面一起上传的 vendor/ 本地库；若缺失（例如上传时漏了该目录）
    // 则自动回退到公共 CDN，保证在任何静态空间都能跑起来。
    const LIBS = [
      {
        name: 'JSZip',
        ok: () => typeof JSZip !== 'undefined',
        local: 'vendor/jszip.min.js',
        cdn: 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'
      },
      {
        name: 'jsPDF',
        ok: () => !!(window.jspdf && window.jspdf.jsPDF),
        local: 'vendor/jspdf.umd.min.js',
        cdn: 'https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js'
      }
    ];
    function loadScript(src) {
      return new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = src; s.onload = res; s.onerror = () => rej(new Error(src));
        document.head.appendChild(s);
      });
    }
    async function ensureLibs() {
      for (const lib of LIBS) {
        if (lib.ok()) continue;
        try { await loadScript(lib.local); } catch (e) { /* 本地缺失 */ }
        if (lib.ok()) continue;
        try { await loadScript(lib.cdn); } catch (e) { /* CDN 也失败 */ }
      }
    }

    // 依赖库自检（本地 vendor 加载失败时给出明确提示）
    function checkLibs() {
      const missing = [];
      if (typeof JSZip === 'undefined') missing.push('JSZip');
      if (!window.jspdf || !window.jspdf.jsPDF) missing.push('jsPDF');
      if (missing.length) {
        document.getElementById('status').innerHTML =
          '<span style="color:#dc2626">⚠️ 依赖库加载失败：' + missing.join('、') +
          '<br>请确认 vendor/ 目录已随网页一起上传（GitHub Pages 需包含该文件夹）</span>';
        return false;
      }
      return true;
    }

    // ================= IndexedDB 存储 =================
    function openDB() {
      return new Promise((res, rej) => {
        const req = indexedDB.open('zip2pdf', 1);
        req.onupgradeneeded = () => {
          req.result.createObjectStore('pdfs', { keyPath: 'id' });
        };
        req.onsuccess = () => res(req.result);
        req.onerror = rej;
      });
    }
    async function dbPut(record) {
      return new Promise((res, rej) => {
        const tx = db.transaction('pdfs', 'readwrite');
        tx.objectStore('pdfs').put(record);
        tx.oncomplete = res; tx.onerror = rej;
      });
    }
    async function dbAll() {
      return new Promise((res, rej) => {
        const req = db.transaction('pdfs').objectStore('pdfs').getAll();
        req.onsuccess = () => res(req.result); req.onerror = rej;
      });
    }
    async function dbDelete(id) {
      return new Promise((res, rej) => {
        const tx = db.transaction('pdfs', 'readwrite');
        tx.objectStore('pdfs').delete(id);
        tx.oncomplete = res; tx.onerror = rej;
      });
    }

    // ================= 分组：按顶层文件夹分组 =================
    // 支持的图片扩展名（浏览器 canvas 可解码的都列入；
    // heic/tiff 等无法原生解码的格式会被识别并在转换时跳过并提示）
    const IMAGE_RE = /\.(jpe?g|jpe|png|webp|bmp|gif|avif|ico|svg|tiff?|heic|heif)$/i;

    function groupByFolder(zip) {
      const groups = new Map();
      const entries = Object.values(zip.files).filter(f => !f.dir);
      for (const f of entries) {
        if (!IMAGE_RE.test(f.name)) continue;
        // 跳过 macOS 打包产生的缩略图与隐藏文件
        if (/__MACOSX/i.test(f.name) || /(^|\/)\.[^/]/.test(f.name)) continue;
        const parts = f.name.split('/');
        const folder = parts.length > 1 ? parts[0] : '';
        if (!groups.has(folder)) groups.set(folder, []);
        groups.get(folder).push(f);
      }
      const keys = [...groups.keys()];
      // 文件夹名全是纯数字时按数值排序（乱码不影响）
      if (keys.every(k => k === '' || /^\d+$/.test(k))) {
        keys.sort((a, b) => (a === '' ? -1 : b === '' ? 1 : Number(a) - Number(b)));
      }
      // 每个文件夹内图片按数字排序：0.jpg, 1.jpg, … 20.jpg
      return keys.map(k => ({
        folder: k,
        images: groups.get(k).sort((a, b) =>
          a.name.localeCompare(b.name, undefined, { numeric: true }))
      }));
    }

    // ================= 从 zip 文件名解析起始话数 =================
    // 11-15.zip → 11；108.zip → 108；无数字 → null
    function parseStartChapter(zipBaseName) {
      const m = zipBaseName.match(/\d+/);
      return m ? parseInt(m[0], 10) : null;
    }

    // 统一输出质量（canvas 重编码用，0.92 肉眼几乎无损且体积可控）
    const JPEG_QUALITY = 0.92;

    // ================= 把任意浏览器可解码的图片转成 JPEG dataURL =================
    // 1) 白底填充：PNG/WebP/GIF 的透明区域转成 JPEG 后不会变黑
    // 2) 统一成 JPEG：jsPDF 用 DCTDecode 嵌入，体积最小、兼容性最好
    function toJpegDataURL(blob) {
      return new Promise((res, rej) => {
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          try {
            // SVG 未声明尺寸时浏览器会给出 0，兜底为 1024
            const w = img.naturalWidth || 1024;
            const h = img.naturalHeight || 1024;
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            const g = c.getContext('2d');
            g.fillStyle = '#ffffff';
            g.fillRect(0, 0, w, h);
            g.drawImage(img, 0, 0, w, h);
            const dataUrl = c.toDataURL('image/jpeg', JPEG_QUALITY);
            // 超大图在 iOS 上可能导出失败，返回近乎空串
            if (!dataUrl || dataUrl.length < 200) {
              rej(new Error('图片过大，浏览器无法处理'));
            } else {
              res({ dataUrl, width: w, height: h });
            }
          } catch (err) { rej(err); }
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          rej(new Error('浏览器无法解码该图片格式'));
        };
        img.src = url;
      });
    }

    // ================= 生成一个 PDF =================
    // 返回 { blob, skipped }：skipped 为解码失败被跳过的文件名
    async function buildPDF(images, onProgress) {
      const jsPDF = window.jspdf && window.jspdf.jsPDF;
      if (!jsPDF) throw new Error('jsPDF 未加载，请检查 vendor/jspdf.umd.min.js');
      let doc = null;
      const skipped = [];
      for (let i = 0; i < images.length; i++) {
        onProgress(i);
        let out;
        try {
          const blob = await images[i].async('blob');
          out = await toJpegDataURL(blob);
        } catch (err) {
          skipped.push(images[i].name);
          continue;
        }
        const orient = out.width >= out.height ? 'landscape' : 'portrait';
        if (!doc) {
          doc = new jsPDF({ orientation: orient, unit: 'px', format: [out.width, out.height] });
        } else {
          doc.addPage([out.width, out.height], orient);
        }
        doc.addImage(out.dataUrl, 'JPEG', 0, 0, out.width, out.height);
      }
      if (!doc) throw new Error('没有可用的图片（格式可能全部不被支持）');
      return { blob: doc.output('blob'), skipped };
    }

    // ================= 大小限制与进度条 =================
    const MAX_BYTES = 200 * 1024 * 1024;   // 200 MB

    function fmtSize(bytes) {
      if (bytes >= 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      return Math.max(1, Math.round(bytes / 1024)) + ' KB';
    }

    // percent: 0~100；label: 当前阶段说明
    function setProgress(percent, label) {
      document.getElementById('barWrap').style.display = 'block';
      document.getElementById('barFill').style.width =
        Math.max(0, Math.min(100, percent)).toFixed(1) + '%';
      document.getElementById('progressText').textContent = label || '';
    }
    function hideProgress() {
      document.getElementById('barWrap').style.display = 'none';
    }

    // 读取文件并回报真实读取进度（FileReader.onprogress）
    function readFileWithProgress(file, onProgress) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
        r.onload = () => res(r.result);
        r.onerror = () => rej(new Error('文件读取失败'));
        r.readAsArrayBuffer(file);
      });
    }

    // ================= 被跳过的图片的提示文案 =================
    function skippedNote(skipped) {
      if (!skipped || !skipped.length) return '';
      const heic = skipped.filter(n => /\.hei[cf]$/i.test(n)).length;
      if (heic) {
        return `｜跳过 ${skipped.length} 张（含 ${heic} 张 HEIC/HEIF，浏览器无法解码，请先转成 JPG）`;
      }
      return `｜跳过 ${skipped.length} 张无法解码的图片`;
    }

    // ================= 转换主流程 =================
    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file) return;
      await ensureLibs();
      if (!checkLibs()) return;

      const status = document.getElementById('status');
      // ===== 200 MB 上限 =====
      if (file.size > MAX_BYTES) {
        hideProgress();
        status.innerHTML = '<span style="color:#dc2626">⚠️ 文件 ' + fmtSize(file.size) +
          ' 超过 200 MB 上限，请拆分压缩包后再上传</span>';
        return;
      }

      const merge = document.getElementById('mergeChk').checked;
      setProgress(0, '读取文件中…（' + fmtSize(file.size) + '）');
      status.textContent = '';
      try {
        // 阶段一：读取文件（真实进度，占前 15%）
        const buf = await readFileWithProgress(file, p => {
          setProgress(p * 15, '读取文件中… ' + Math.round(p * 100) + '%（' + fmtSize(file.size) + '）');
        });
        setProgress(15, '解析压缩包…');
        const zip = await JSZip.loadAsync(buf);
        const groups = groupByFolder(zip);
        const totalImages = groups.reduce((s, g) => s + g.images.length, 0);
        if (!totalImages) {
          hideProgress();
          status.textContent = 'ZIP 里没有找到图片（支持 jpg/png/webp/bmp/gif/avif/svg 等）';
          return;
        }

        const baseName = file.name.replace(/\.zip$/i, '');
        const startChapter = parseStartChapter(baseName);
        let convDone = 0;      // 跨 PDF 累计已处理页数，用于总体进度
        let allSkipped = [];

        if (merge) {
          // ===== 合并模式：所有文件夹 → 一个 PDF，名字 = zip 名 =====
          const allImages = groups.flatMap(g => g.images);
          const { blob: pdfBlob, skipped } = await buildPDF(allImages, (i) => {
            setProgress(15 + (i + 1) / allImages.length * 85,
              '转换图片 ' + (i + 1) + '/' + allImages.length);
          });
          allSkipped = skipped;
          await dbPut({
            id: Date.now() + '',
            name: `${baseName}.pdf`,
            size: pdfBlob.size,
            createdAt: new Date().toLocaleString('zh-CN'),
            sent: false,
            blob: pdfBlob
          });
          setProgress(100, '完成 ✔');
          status.textContent =
            `完成！已合并为 1 个 PDF（共 ${allImages.length - skipped.length} 页）` +
            skippedNote(skipped);
        } else {
          // ===== 分话模式：每个文件夹 → 第X话.pdf =====
          for (let gi = 0; gi < groups.length; gi++) {
            const g = groups[gi];
            const pdfName = startChapter !== null && groups.length > 1
              ? `第${startChapter + gi}话.pdf`
              : (groups.length > 1 ? `${baseName}-${gi + 1}.pdf` : `${baseName}.pdf`);

            const { blob: pdfBlob, skipped } = await buildPDF(g.images, () => {
              convDone++;
              setProgress(15 + convDone / totalImages * 85,
                '转换中 ' + convDone + '/' + totalImages +
                '（第 ' + (gi + 1) + '/' + groups.length + ' 个 PDF）');
            });
            allSkipped = allSkipped.concat(skipped);

            await dbPut({
              id: Date.now() + '-' + gi,
              name: pdfName,
              size: pdfBlob.size,
              createdAt: new Date().toLocaleString('zh-CN'),
              sent: false,
              blob: pdfBlob
            });
            renderLibrary();
          }
          setProgress(100, '完成 ✔');
          status.textContent =
            `全部完成！共生成 ${groups.length} 个 PDF` + skippedNote(allSkipped);
        }
        renderLibrary();
      } catch (err) {
        status.textContent = '出错了：' + err.message;
      }
    });

    // ================= 直接选图片 → 合成一个 PDF =================
    document.getElementById('imgInput').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []);
      e.target.value = '';
      if (!files.length) return;
      await ensureLibs();
      if (!checkLibs()) return;
      const status = document.getElementById('status');

      // ===== 200 MB 上限（按本次选择的总大小）=====
      const totalBytes = files.reduce((s, f) => s + f.size, 0);
      if (totalBytes > MAX_BYTES) {
        hideProgress();
        status.innerHTML = '<span style="color:#dc2626">⚠️ 所选图片合计 ' + fmtSize(totalBytes) +
          ' 超过 200 MB 上限，请少选一些</span>';
        return;
      }

      setProgress(0, '准备中…（' + files.length + ' 张，' + fmtSize(totalBytes) + '）');
      status.textContent = '';
      try {
        // 按文件名自然排序，保证 1.jpg / 2.jpg / 10.jpg 顺序正确
        files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
        // 包装成与 JSZip 条目一致的结构，复用 buildPDF
        const items = files.map(f => ({ name: f.name, async: () => Promise.resolve(f) }));
        const { blob: pdfBlob, skipped } = await buildPDF(items, (i) => {
          setProgress((i + 1) / items.length * 100, '转换图片 ' + (i + 1) + '/' + items.length);
        });
        const d = new Date();
        const pad = n => String(n).padStart(2, '0');
        await dbPut({
          id: 'img-' + Date.now(),
          name: `图片_${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.pdf`,
          size: pdfBlob.size,
          createdAt: d.toLocaleString('zh-CN'),
          sent: false,
          blob: pdfBlob
        });
        setProgress(100, '完成 ✔');
        status.textContent =
          `完成！${items.length - skipped.length} 张图已合成 1 个 PDF` + skippedNote(skipped);
        renderLibrary();
      } catch (err) {
        status.textContent = '出错了：' + err.message;
      }
    });

    // ================= PDF 库列表 =================
    async function renderLibrary() {
      const list = await dbAll();
      const el = document.getElementById('library');
      if (!list.length) {
        el.innerHTML = '<div class="empty">还没有 PDF，先转换一个 ZIP 吧</div>';
        return;
      }
      el.innerHTML = '';
      list.sort((a, b) => (b.id + '').localeCompare(a.id + '', undefined, { numeric: true }))
          .forEach(rec => {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
          <div class="name">${rec.name}</div>
          <div class="meta">创建：${rec.createdAt} · ${(rec.size / 1024 / 1024).toFixed(2)} MB
            · ${rec.sent ? '✅ 已发 Kindle' : '⬜ 未发送'}</div>
          <div class="ops">
            <button class="btn small" data-act="send">发到 Kindle</button>
            <button class="btn small gray" data-act="rename">重命名</button>
            <button class="btn small gray" data-act="download">下载</button>
            <button class="btn small danger" data-act="delete">删除</button>
          </div>`;
        div.querySelector('[data-act=send]').onclick = () => sendToKindle(rec);
        div.querySelector('[data-act=rename]').onclick = () => rename(rec);
        div.querySelector('[data-act=download]').onclick = () => download(rec);
        div.querySelector('[data-act=delete]').onclick = () => remove(rec);
        el.appendChild(div);
      });
    }

    // ================= 重命名 =================
    async function rename(rec) {
      const newName = prompt('输入新的文件名（可不含 .pdf 后缀，会自动补上）：', rec.name);
      if (!newName || !newName.trim()) return;
      let name = newName.trim();
      if (!/\.pdf$/i.test(name)) name += '.pdf';
      await dbPut({ ...rec, name });
      renderLibrary();
    }

    // ================= 发送到 Kindle =================
    const KINDLE_EMAIL = '2394244128@kindle.com'; // ←★ 改成你的 Kindle 邮箱

    async function sendToKindle(rec) {
      const file = new File([rec.blob], rec.name, { type: 'application/pdf' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: rec.name });
          await dbPut({ ...rec, sent: true });
          renderLibrary();
          return;
        } catch (e) {
          if (e.name === 'AbortError') return; // 用户取消
        }
      }
      // 降级：下载后手动用邮件 App 发
      download(rec);
      alert('此浏览器不支持直接分享文件。\n已为你下载 PDF，请用邮件 App 把它发给：\n' + KINDLE_EMAIL);
    }

    // ================= 下载 / 删除 =================
    function download(rec) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(rec.blob);
      a.download = rec.name;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    async function remove(rec) {
      if (!confirm(`删除「${rec.name}」？\n（App 内副本会被删除；已下载到手机里的原件请自行删除）`)) return;
      await dbDelete(rec.id);
      renderLibrary();
    }

    // ================= 初始化 =================
    (async () => {
      await ensureLibs();
      checkLibs();
      try {
        db = await openDB();
        renderLibrary();
      } catch (e) {
        // file:// 直接打开、或隐私模式下 IndexedDB 可能不可用
        document.getElementById('library').innerHTML =
          '<div class="empty">⚠️ 本地存储不可用（请用 http/https 网址访问，不要直接双击打开文件）</div>';
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    })();
  </script>
</body>
</html>
